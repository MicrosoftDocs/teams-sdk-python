uid: microsoft_teams.common.ClientOptions
name: ClientOptions
fullName: microsoft_teams.common.ClientOptions
module: microsoft_teams.common
summary: Configuration options for the HTTP Client.
constructor:
  syntax: 'ClientOptions(base_url: str | None = None, headers: ~typing.Dict[str, str]
    = <factory>, timeout: float | None = None, token: str | ~microsoft_teams.common.http.client_token.StringLike
    | ~typing.Callable[[], str | ~microsoft_teams.common.http.client_token.StringLike
    | None | ~typing.Awaitable[str | ~microsoft_teams.common.http.client_token.StringLike
    | None]] | None = None, interceptors: ~typing.List[~microsoft_teams.common.http.interceptor.Interceptor]
    | None = None)'
  parameters:
  - name: base_url
    defaultValue: None
  - name: headers
    defaultValue: <factory>
  - name: timeout
    defaultValue: None
  - name: token
    defaultValue: None
  - name: interceptors
    defaultValue: None
attributes:
- uid: microsoft_teams.common.ClientOptions.base_url
  name: base_url
  summary: The base URL for all requests.
  signature: 'base_url: str | None = None'
- uid: microsoft_teams.common.ClientOptions.headers
  name: headers
  summary: Default headers to include with every request.
  signature: 'headers: Dict[str, str]'
- uid: microsoft_teams.common.ClientOptions.timeout
  name: timeout
  summary: Default request timeout in seconds.

### YamlMime:PythonClass
uid: microsoft_teams.graph.auth_provider.AuthProvider
name: AuthProvider
fullName: microsoft_teams.graph.auth_provider.AuthProvider
module: microsoft_teams.graph.auth_provider
summary: 'Provides authentication for Microsoft Graph using Teams tokens.


  Initialize the AuthProvider.'
constructor:
  syntax: 'AuthProvider(token: str | StringLike | Callable[[], str | StringLike |
    None | Awaitable[str | StringLike | None]] | None)'
  parameters:
  - name: token
    description: Token data (string, StringLike, callable, or None)
    isRequired: true
methods:
- uid: microsoft_teams.graph.auth_provider.AuthProvider.get_token
  name: get_token
  summary: Retrieve an access token for Microsoft Graph.
  signature: 'get_token(*scopes: str, **kwargs: Any) -> AccessToken'
  parameters:
  - name: '*scopes'
    description: Token scopes (required for interface compatibility)
    isRequired: true
  - name: '**kwargs'
    description: Additional keyword arguments
    isRequired: true
  return:
    description: The access token for Microsoft Graph
    types:
    - <xref:AccessToken>
  exceptions:
  - type: ClientAuthenticationError
    description: If the token is invalid or authentication fails

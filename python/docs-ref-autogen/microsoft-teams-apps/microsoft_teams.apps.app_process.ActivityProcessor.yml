### YamlMime:PythonClass
uid: microsoft_teams.apps.app_process.ActivityProcessor
name: ActivityProcessor
fullName: microsoft_teams.apps.app_process.ActivityProcessor
module: microsoft_teams.apps.app_process
summary: Provides activity processing functionality with middleware chain support.
constructor:
  syntax: 'ActivityProcessor(router: ActivityRouter, id: str | None, storage: Storage[str,
    Any] | LocalStorage[Any], default_connection_name: str, http_client: Client, token_manager:
    TokenManager, api_client_settings: ApiClientSettings | None, activity_sender:
    ActivitySender, cloud: CloudEnvironment = CloudEnvironment(login_endpoint=''https://login.microsoftonline.com'',
    login_tenant=''botframework.com'', bot_scope=''https://api.botframework.com/.default'',
    token_service_url=''https://token.botframework.com'', openid_metadata_url=''https://login.botframework.com/v1/.well-known/openidconfiguration'',
    token_issuer=''https://api.botframework.com'', graph_scope=''https://graph.microsoft.com/.default''))'
  parameters:
  - name: router
    isRequired: true
  - name: id
    isRequired: true
  - name: storage
    isRequired: true
  - name: default_connection_name
    isRequired: true
  - name: http_client
    isRequired: true
  - name: token_manager
    isRequired: true
  - name: api_client_settings
    isRequired: true
  - name: activity_sender
    isRequired: true
  - name: cloud
    defaultValue: CloudEnvironment(login_endpoint='https://login.microsoftonline.com',
      login_tenant='botframework.com', bot_scope='https://api.botframework.com/.default',
      token_service_url='https://token.botframework.com', openid_metadata_url='https://login.botframework.com/v1/.well-known/openidconfiguration',
      token_issuer='https://api.botframework.com', graph_scope='https://graph.microsoft.com/.default')
methods:
- uid: microsoft_teams.apps.app_process.ActivityProcessor.execute_middleware_chain
  name: execute_middleware_chain
  summary: Execute the middleware chain for activity handlers.
  signature: 'async execute_middleware_chain(ctx: ActivityContext[Activity], handlers:
    List[Callable[[ActivityContext[Activity]], Awaitable[Any | None]]]) -> Dict[str,
    Any] | None'
  parameters:
  - name: ctx
    description: Context object for the activity
    isRequired: true
  - name: handlers
    description: List of activity handlers to execute
    isRequired: true
  return:
    description: Final response from handlers, if any
- uid: microsoft_teams.apps.app_process.ActivityProcessor.process_activity
  name: process_activity
  signature: 'async process_activity(plugins: List[PluginBase], event: ActivityEvent)
    -> InvokeResponse[Any]'
  parameters:
  - name: plugins
    isRequired: true
  - name: event
    isRequired: true

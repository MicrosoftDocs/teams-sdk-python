functions:
- uid: microsoft_teams.apps.utils.create_graph_client
  name: create_graph_client
  summary: Lazy import and create a Graph client with the given token.
  signature: 'create_graph_client(token: str | StringLike | Callable[[], str | StringLike
    | None | Awaitable[str | StringLike | None]] | None, cloud: CloudEnvironment |
    None = None)'
  parameters:
  - name: token
    description: The token used to authenticate Graph requests.
    isRequired: true
  - name: cloud
    description: 'Optional cloud environment. When provided (and non-None), the Graph
      client

      routes HTTP calls to the cloud''s Graph endpoint derived from `graph_scope`.

      When `None`, the public Graph endpoint is used.'
    defaultValue: None
- uid: microsoft_teams.apps.utils.extract_tenant_id
  name: extract_tenant_id
  summary: 'Extract tenant ID from an activity with fallback logic.


    Attempts to extract tenant ID from multiple sources in the following order:

    1. activity.conversation.tenant_id (primary source)

    2. activity.tenant.id (fallback source from channel data)'
  signature: 'extract_tenant_id(activity: Activity) -> str | None'
  parameters:
  - name: activity
    description: The activity to extract tenant ID from
    isRequired: true
  return:
    description: The tenant ID if found, None otherwise
- uid: microsoft_teams.apps.utils.retry
  name: retry
  signature: 'async retry(factory: Callable[[], Awaitable[T]], options: RetryOptions
    | None = None) -> T'
  parameters:
  - name: factory
    isRequired: true
  - name: options
    defaultValue: None
- uid: microsoft_teams.apps.utils.to_threaded_conversation_id
  name: to_threaded_conversation_id
  summary: 'Construct a threaded conversation ID by appending *;messageid={message_id}*

    to the conversation ID. This is the format APX uses to route messages

    to a specific thread.'
  signature: 'to_threaded_conversation_id(conversation_id: str, message_id: str) ->
    str'
  parameters:
  - name: conversation_id
    description: The conversation to thread into (e.g. *19:abc@thread.skype*)
    isRequired: true
  - name: message_id
    description: The thread root message ID (must be a non-zero numeric string)
    isRequired: true
  return:
    description: <xref:mailto:abc@thread.skype>;messageid=123`)

### YamlMime:PythonClass
uid: microsoft_teams.apps.ActivityContext
name: ActivityContext
fullName: microsoft_teams.apps.ActivityContext
module: microsoft_teams.apps
summary: "Context object passed to activity handlers with middleware support.\n\n\
  > [!NOTE]\n> The single-connection OAuth surface here - <xref:is_signed_in>,\n>\n\
  > <xref:user_token>, <xref:microsoft_teams.apps.ActivityContext.user_graph>, <xref:microsoft_teams.apps.ActivityContext.sign_in>,\n\
  >\n> <xref:microsoft_teams.apps.ActivityContext.sign_out> and <xref:microsoft_teams.apps.ActivityContext.get_user_token>\
  \ - predates\n>\n> multi-connection support and is deprecated.\n>\n> \n>\n> Register\
  \ connections with\n>\n> app.add_oauth_flow(name) and use the returned OAuthFlow,\
  \ which\n>\n> pins every operation to the connection that owns it.\n>"
constructor:
  syntax: 'ActivityContext(activity: T, app_id: str, storage: Storage[str, Any], api:
    ApiClient, user_token: str | None, conversation_ref: ConversationReference, is_signed_in:
    bool, connection_name: str, app_token: str | StringLike | Callable[[], str | StringLike
    | None | Awaitable[str | StringLike | None]] | None, cloud: CloudEnvironment =
    CloudEnvironment(login_endpoint=''https://login.microsoftonline.com'', login_tenant=''botframework.com'',
    bot_scope=''https://api.botframework.com/.default'', agent_bot_scope=''https://botapi.skype.com/.default'',
    token_service_url=''https://token.botframework.com'', openid_metadata_url=''https://login.botframework.com/v1/.well-known/openidconfiguration'',
    token_issuer=''https://api.botframework.com'', graph_scope=''https://graph.microsoft.com/.default''),
    oauth_connection_names: Sequence[str] | None = None, files_credential: GraphCredential
    | None = None)'
  parameters:
  - name: activity
    isRequired: true
  - name: app_id
    isRequired: true
  - name: storage
    isRequired: true
  - name: api
    isRequired: true
  - name: user_token
    isRequired: true
  - name: conversation_ref
    isRequired: true
  - name: is_signed_in
    isRequired: true
  - name: connection_name
    isRequired: true
  - name: app_token
    isRequired: true
  - name: cloud
    defaultValue: CloudEnvironment(login_endpoint='https://login.microsoftonline.com',
      login_tenant='botframework.com', bot_scope='https://api.botframework.com/.default',
      agent_bot_scope='https://botapi.skype.com/.default', token_service_url='https://token.botframework.com',
      openid_metadata_url='https://login.botframework.com/v1/.well-known/openidconfiguration',
      token_issuer='https://api.botframework.com', graph_scope='https://graph.microsoft.com/.default')
  - name: oauth_connection_names
    defaultValue: None
  - name: files_credential
    defaultValue: None
methods:
- uid: microsoft_teams.apps.ActivityContext.get_connection_status
  name: get_connection_status
  summary: 'Get the token status for every OAuth connection registered on the bot.


    A single Token Service call returns the status for all connections, so

    the developer never needs to enumerate connection names manually.

    Service failures propagate rather than being reported as signed out.


    The bulk call reports only connections the Token Service knows about, and

    it can lag a token that was just written. Any registered OAuth flow that

    comes back missing or `has_token=False` is therefore re-checked with a

    direct per-connection lookup, so a freshly signed-in flow is never

    reported as signed out. Connections that are not registered are passed

    through untouched, and a non-404 lookup failure propagates.'
  signature: async get_connection_status() -> List[TokenStatus]
- uid: microsoft_teams.apps.ActivityContext.get_user_token
  name: get_user_token
  summary: 'Get the user''s token for a connection.


    *Deprecated since version Use:* `app.get_oauth_flow(name).get_token(ctx)`, which
    reads the

    token from the flow that owns the connection.'
  signature: 'async get_user_token(connection_name: str | None = None) -> str | None'
  parameters:
  - name: connection_name
    description: 'The connection to read. Defaults to the app''s

      default connection.'
    defaultValue: None
  return:
    description: 'The token if the user is signed in, or `None` if they are not

      (the Token Service returns 404 when no token is cached).'
  exceptions:
  - type: HTTPStatusError
    description: "for any non-404 failure (e.g. the Token Service is\n    unavailable).\
      \ Such errors are surfaced rather than being masked\n    as \"not signed in\"\
      , so a genuine outage is not mistaken for a\n    logged-out user."
- uid: microsoft_teams.apps.ActivityContext.next
  name: next
  summary: Call the next middleware in the chain.
  signature: async next() -> None
- uid: microsoft_teams.apps.ActivityContext.quote
  name: quote
  summary: 'Send a message to the conversation with a quoted message reference prepended
    to the text.

    Teams renders the quoted message as a preview bubble above the response text.'
  signature: 'async quote(message_id: str, input: str | MessageActivityInput | MessageReactionActivityInput
    | TypingActivityInput) -> SentActivity'
  parameters:
  - name: message_id
    description: The ID of the message to quote
    isRequired: true
  - name: input
    description: "The response text or activity \u2014 a quote placeholder for message_id\
      \ will be prepended to its text"
    isRequired: true
  return:
    description: The sent activity
- uid: microsoft_teams.apps.ActivityContext.reply
  name: reply
  summary: 'Send a message in the current conversation with a visual quote of the
    inbound message.


    In channels, sends to the current thread with a quoted reply.

    In other scopes, sends with a quoted reply.

    To send without quoting, use <xref:microsoft_teams.apps.ActivityContext.send>.'
  signature: 'async reply(input: str | MessageActivityInput | MessageReactionActivityInput
    | TypingActivityInput) -> SentActivity'
  parameters:
  - name: input
    isRequired: true
- uid: microsoft_teams.apps.ActivityContext.send
  name: send
  summary: 'Send a message in the current conversation without quoting.


    In channels, sends to the current thread. In scopes that do not

    support threading (group chat, meetings), sends as a normal message.

    To send with a visual quote of the inbound message, use <xref:microsoft_teams.apps.ActivityContext.reply>.'
  signature: 'async send(message: str | MessageActivityInput | MessageReactionActivityInput
    | TypingActivityInput | AdaptiveCard, conversation_ref: ConversationReference
    | None = None) -> SentActivity'
  parameters:
  - name: message
    description: The message to send, can be a string, ActivityParams, or AdaptiveCard
    isRequired: true
  - name: conversation_ref
    description: Optional conversation reference to send to a different conversation
      or thread
    defaultValue: None
- uid: microsoft_teams.apps.ActivityContext.set_next
  name: set_next
  summary: Set the next handler in the middleware chain.
  signature: 'set_next(handler: Callable[[], Awaitable[None]]) -> None'
  parameters:
  - name: handler
    isRequired: true
- uid: microsoft_teams.apps.ActivityContext.sign_in
  name: sign_in
  summary: 'Initiate a sign-in flow for the user.


    *Deprecated since version Targets:* the app''s single `connection_name`, which
    does not

    generalize past one connection. Use

    `app.get_oauth_flow(name).sign_in(ctx, options)`, which pins the

    connection to the flow that owns it.'
  signature: 'async sign_in(options: SignInOptions | None = None) -> str | None'
  parameters:
  - name: options
    description: Optional signin options to customize the flow
    defaultValue: None
  return:
    description: The token if already available, otherwise None after sending OAuth
      card
- uid: microsoft_teams.apps.ActivityContext.sign_out
  name: sign_out
  summary: 'Sign out the user by clearing their token.


    This method will remove the user''s token from the storage.


    *Deprecated since version Use:* `app.get_oauth_flow(name).sign_out(ctx)`, which
    cannot sign

    out of the wrong connection.'
  signature: 'async sign_out(connection_name: str | None = None) -> None'
  parameters:
  - name: connection_name
    description: 'The connection to sign out of. Defaults to the

      app''s default connection.'
    defaultValue: None
  exceptions:
  - type: HTTPStatusError
    description: "if the Token Service rejects the request. A failed\n    sign-out\
      \ leaves the token in place, so callers must be able to\n    see that it did\
      \ not happen."
attributes:
- uid: microsoft_teams.apps.ActivityContext.app_graph
  name: app_graph
  summary: 'Get a Microsoft Graph client configured with the app''s token.


    This client can be used for app-only operations that don''t require user context.'
  exceptions:
  - type: ValueError
    description: If no app token is available.
  - type: RuntimeError
    description: If the graph client cannot be created.
  - type: ImportError
    description: If the graph dependencies are not installed.
- uid: microsoft_teams.apps.ActivityContext.files
  name: files
  summary: 'file.download.info` subset of

    *activity.attachments*, mapped to *IncomingFile*. See *FilesAccessor*.'
- uid: microsoft_teams.apps.ActivityContext.stream
  name: stream
- uid: microsoft_teams.apps.ActivityContext.user_graph
  name: user_graph
  summary: "Get a Microsoft Graph client configured with the user's token.\n\n*Deprecated\
    \ since version Built:* from <xref:user_token>, which holds the token for whichever\n\
    connection signed in most recently rather than the one that talks to\nMicrosoft\
    \ Graph.\n\nRead the token from the owning flow instead::\n   token = await app.get_oauth_flow(\"\
    graph\").get_token(ctx)"
  exceptions:
  - type: ValueError
    description: If the user is not signed in or doesn't have a valid token.
  - type: RuntimeError
    description: If the graph client cannot be created.
  - type: ImportError
    description: If the graph dependencies are not installed.

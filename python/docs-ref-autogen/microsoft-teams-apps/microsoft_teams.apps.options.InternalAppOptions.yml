### YamlMime:PythonClass
uid: microsoft_teams.apps.options.InternalAppOptions
name: InternalAppOptions
fullName: microsoft_teams.apps.options.InternalAppOptions
module: microsoft_teams.apps.options
summary: Internal dataclass for AppOptions with defaults and non-nullable fields.
constructor:
  syntax: 'InternalAppOptions(skip_auth: bool = False, default_connection_name: str
    = ''graph'', plugins: ~typing.List[~microsoft_teams.apps.plugins.plugin_base.PluginBase]
    = <factory>, api_client_settings: ~microsoft_teams.api.clients.api_client_settings.ApiClientSettings
    | None = None, client: ~microsoft_teams.common.http.client.Client | ~microsoft_teams.common.http.client.ClientOptions
    | None = None, client_id: str | None = None, client_secret: str | None = None,
    tenant_id: str | None = None, application_id_uri: str | None = None, token: ~typing.Callable[[str
    | list[str], str | None], str | ~typing.Awaitable[str]] | None = None, managed_identity_client_id:
    str | None = None, storage: ~microsoft_teams.common.storage.storage.Storage[str,
    ~typing.Any] | None = None, service_url: str | None = None, http_server_adapter:
    ~microsoft_teams.apps.http.adapter.HttpServerAdapter | None = None, messaging_endpoint:
    str = ''/api/messages'', cloud: ~microsoft_teams.api.auth.cloud_environment.CloudEnvironment
    | None = None)'
  parameters:
  - name: skip_auth
    defaultValue: 'False'
  - name: default_connection_name
    defaultValue: graph
  - name: plugins
    defaultValue: <factory>
  - name: api_client_settings
    defaultValue: None
  - name: client
    defaultValue: None
  - name: client_id
    defaultValue: None
  - name: client_secret
    defaultValue: None
  - name: tenant_id
    defaultValue: None
  - name: application_id_uri
    defaultValue: None
  - name: token
    defaultValue: None
  - name: managed_identity_client_id
    defaultValue: None
  - name: storage
    defaultValue: None
  - name: service_url
    defaultValue: None
  - name: http_server_adapter
    defaultValue: None
  - name: messaging_endpoint
    defaultValue: /api/messages
  - name: cloud
    defaultValue: None
methods:
- uid: microsoft_teams.apps.options.InternalAppOptions.from_typeddict
  name: from_typeddict
  summary: Create InternalAppOptions from AppOptions TypedDict with defaults applied.
  signature: 'from_typeddict(options: AppOptions) -> InternalAppOptions'
  parameters:
  - name: options
    description: AppOptions TypedDict (potentially with None values)
    isRequired: true
  return:
    description: InternalAppOptions with proper defaults and non-nullable required
      fields
attributes:
- uid: microsoft_teams.apps.options.InternalAppOptions.api_client_settings
  name: api_client_settings
  summary: API client settings used for overriding.
  signature: 'api_client_settings: ApiClientSettings | None = None'
- uid: microsoft_teams.apps.options.InternalAppOptions.application_id_uri
  name: application_id_uri
  summary: 'Application ID URI from the Azure portal. Used for user authentication.

    Matches webApplicationInfo.resource in the app manifest.'
  signature: 'application_id_uri: str | None = None'
- uid: microsoft_teams.apps.options.InternalAppOptions.client
  name: client
  summary: HTTP client or client options used to make API requests.
  signature: 'client: Client | ClientOptions | None = None'
- uid: microsoft_teams.apps.options.InternalAppOptions.client_id
  name: client_id
  summary: The client ID of the app registration.
  signature: 'client_id: str | None = None'
- uid: microsoft_teams.apps.options.InternalAppOptions.client_secret
  name: client_secret
  summary: The client secret. If provided with client_id, uses ClientCredentials auth.
  signature: 'client_secret: str | None = None'
- uid: microsoft_teams.apps.options.InternalAppOptions.cloud
  name: cloud
  summary: Cloud environment for sovereign cloud support.
  signature: 'cloud: CloudEnvironment | None = None'
- uid: microsoft_teams.apps.options.InternalAppOptions.default_connection_name
  name: default_connection_name
  summary: The OAuth connection name to use for authentication.
  signature: 'default_connection_name: str = ''graph'''
- uid: microsoft_teams.apps.options.InternalAppOptions.http_server_adapter
  name: http_server_adapter
  summary: Custom HTTP server adapter. Defaults to FastAPIAdapter if not provided.
  signature: 'http_server_adapter: HttpServerAdapter | None = None'
- uid: microsoft_teams.apps.options.InternalAppOptions.managed_identity_client_id
  name: managed_identity_client_id
  summary: 'The managed identity client ID for user-assigned managed identity.

    Set to "system" for system-assigned managed identity (triggers Federated Identity
    Credentials).

    If set to a different client ID than client_id, triggers Federated Identity Credentials
    with user-assigned MI.

    If not set or equals client_id, uses direct managed identity (no federation).'
  signature: 'managed_identity_client_id: str | None = None'
- uid: microsoft_teams.apps.options.InternalAppOptions.messaging_endpoint
  name: messaging_endpoint
  summary: URL path for the Teams messaging endpoint. Defaults to '/api/messages'.
  signature: 'messaging_endpoint: str = ''/api/messages'''
- uid: microsoft_teams.apps.options.InternalAppOptions.service_url
  name: service_url
  summary: 'Base Service URL for BotBackend.

    Uses environment variable SERVICE_URL if not provided

    and defaults to [https://smba.trafficmanager.net/teams](https://smba.trafficmanager.net/teams)'
  signature: 'service_url: str | None = None'
- uid: microsoft_teams.apps.options.InternalAppOptions.tenant_id
  name: tenant_id
  summary: The tenant ID. Required for single-tenant apps.
  signature: 'tenant_id: str | None = None'
- uid: microsoft_teams.apps.options.InternalAppOptions.token
  name: token
  summary: Custom token provider function. If provided with client_id (no client_secret),
    uses TokenCredentials.
  signature: 'token: Callable[[str | list[str], str | None], str | Awaitable[str]]
    | None = None'
- uid: microsoft_teams.apps.options.InternalAppOptions.plugins
  name: plugins
  signature: 'plugins: List[PluginBase]'
- uid: microsoft_teams.apps.options.InternalAppOptions.skip_auth
  name: skip_auth
  signature: 'skip_auth: bool = False'
- uid: microsoft_teams.apps.options.InternalAppOptions.storage
  name: storage
  signature: 'storage: Storage[str, Any] | None = None'

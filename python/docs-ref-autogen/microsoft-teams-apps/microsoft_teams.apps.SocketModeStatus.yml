uid: microsoft_teams.apps.SocketModeStatus
name: SocketModeStatus
fullName: microsoft_teams.apps.SocketModeStatus
module: microsoft_teams.apps
summary: 'Experimental lifecycle status of a socket; may change in the future.


  `READY` requires more than an open socket: the service must also have pushed

  the `SocketReady` frame, which is what admits inbound activities.'

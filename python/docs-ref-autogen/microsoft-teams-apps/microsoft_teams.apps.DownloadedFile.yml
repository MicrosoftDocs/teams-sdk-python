### YamlMime:PythonClass
uid: microsoft_teams.apps.DownloadedFile
name: DownloadedFile
fullName: microsoft_teams.apps.DownloadedFile
module: microsoft_teams.apps
summary: 'A buffered, point-in-time snapshot of a downloaded file''s bytes that the
  caller owns.


  Returned by *IncomingFile.download()*. The bytes are already in memory, so the convenience
  readers here are

  synchronous and never re-download.

  Because it is a snapshot, holding one and reusing it is the way to read the same
  file several ways without

  re-fetching through the live *IncomingFile* handle.'
constructor:
  syntax: 'DownloadedFile(bytes: bytes, content_type: str, filename: str, source_url:
    str)'
  parameters:
  - name: bytes
    isRequired: true
  - name: content_type
    isRequired: true
  - name: filename
    isRequired: true
  - name: source_url
    isRequired: true
methods:
- uid: microsoft_teams.apps.DownloadedFile.save_as
  name: save_as
  summary: 'Write the already-buffered bytes to a local file path (no re-fetch, unlike
    *IncomingFile.save_as()* which

    streams a fresh download).'
  signature: 'async save_as(path: str) -> None'
  parameters:
  - name: path
    isRequired: true
- uid: microsoft_teams.apps.DownloadedFile.text
  name: text
  summary: 'Decode bytes as UTF-8 (or a provided encoding). No content-type check.

    Lossy: invalid bytes become the U+FFFD replacement character and never throw.

    For strict or binary-safe reads, use *bytes*.'
  signature: 'text(encoding: str = ''utf-8'') -> str'
  parameters:
  - name: encoding
    defaultValue: utf-8
attributes:
- uid: microsoft_teams.apps.DownloadedFile.bytes
  name: bytes
  summary: The file bytes, buffered from *stream()* read to completion.
  signature: 'bytes: bytes'
- uid: microsoft_teams.apps.DownloadedFile.content_type
  name: content_type
  summary: 'MIME type resolved from the download response header, or the incoming
    file''s metadata type if the

    response omits one. Falls back to *application/octet-stream* when neither provides
    a type, so this is

    never empty.'
  signature: 'content_type: str'
- uid: microsoft_teams.apps.DownloadedFile.filename
  name: filename
  summary: Resolved filename.
  signature: 'filename: str'
- uid: microsoft_teams.apps.DownloadedFile.source_url
  name: source_url
  summary: The URL the bytes were actually fetched from.
  signature: 'source_url: str'

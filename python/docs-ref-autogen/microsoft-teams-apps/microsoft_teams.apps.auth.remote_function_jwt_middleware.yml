functions:
- uid: microsoft_teams.apps.auth.remote_function_jwt_middleware.validate_remote_function_request
  name: validate_remote_function_request
  summary: Validate JWT and extract client context from request headers for remote
    function calls.
  signature: 'async validate_remote_function_request(headers: Dict[str, str], entra_token_validator:
    TokenValidator | None) -> tuple[Optional[microsoft_teams.apps.contexts.client_context.ClientContext],
    Optional[str]]'
  parameters:
  - name: headers
    description: Request headers dict.
    isRequired: true
  - name: entra_token_validator
    description: TokenValidator instance for Entra ID tokens.
    isRequired: true
  return:
    description: Tuple of (ClientContext, None) on success or (None, error_message)
      on failure.

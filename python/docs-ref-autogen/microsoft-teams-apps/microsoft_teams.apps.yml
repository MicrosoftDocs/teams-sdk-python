- uid: microsoft_teams.apps.inject_widget_protocol
  name: inject_widget_protocol
  summary: 'Injects the MCP Apps protocol script into widget HTML.


    This sets up:

    - The ui/initialize handshake (required for rendering)

    - Size reporting via ui/notifications/size-changed

    - Optional notification hooks (opt-in via notifications option)


    If the HTML already contains the protocol (detected by ''ui/initialize''), it
    is returned unchanged.


    Diagnostic: ExperimentalTeamsHtmlWidget'
  signature: 'inject_widget_protocol(html: str, options: InjectWidgetProtocolOptions
    | None = None) -> str'
  parameters:
  - name: html
    isRequired: true
  - name: options
    defaultValue: None

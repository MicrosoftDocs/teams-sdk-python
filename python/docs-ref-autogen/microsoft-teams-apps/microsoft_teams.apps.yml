- uid: microsoft_teams.apps.create_state_loader
  name: create_state_loader
  summary: 'Resolve the `App(state=...)` option into a loader (or `None` when off).


    `state` is the opt-in value: falsy disables state; `True` enables it with

    defaults; a `StateOptions` configures it. The loader''s storage is the one on

    `StateOptions` when provided, otherwise the app''s shared `fallback_storage`.

    A warning is logged when that resolves to in-memory `LocalStorage`.'
  signature: 'create_state_loader(state: bool | StateOptions | None, fallback_storage:
    Storage[str, Any]) -> TurnStateLoader | None'
  parameters:
  - name: state
    isRequired: true
  - name: fallback_storage
    isRequired: true

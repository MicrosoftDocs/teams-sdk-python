- uid: microsoft_teams.apps.try_get_widget_model_context
  name: try_get_widget_model_context
  summary: "Attempt to extract an MCP UI update-model-context request from a message\
    \ activity's value.\n\nA widget can request that content be added to the model\
    \ context by reusing the messageBack\nmechanism (like Action.Submit for adaptive\
    \ cards).\nSuch a request arrives as a normal message activity whose value carries\
    \ the\nMcpUiUpdateModelContextRequest payload.\nThis is fire-and-forget: the bot\
    \ does not respond.\n\nThis helper is tolerant of two wire shapes:\n   1. The\
    \ raw request object ({\"method\": \"ui/update-model-context\", \"params\": ...}).\
    \ \n\n   2. An envelope of the form {\"type\": \"widgetModelContext\", \"data\"\
    : <request>}. \n\nDiagnostic: ExperimentalTeamsHtmlWidget"
  signature: 'try_get_widget_model_context(activity: Any) -> McpUiUpdateModelContextRequest
    | None'
  parameters:
  - name: activity
    description: A message activity (or any object with a value attribute).
    isRequired: true
  return:
    description: The parsed request, or None if value is not a valid update-model-context
      request.
- uid: microsoft_teams.apps.validate_remote_function_request
  name: validate_remote_function_request
  summary: Validate JWT and extract client context from request headers for remote
    function calls.
  signature: 'async validate_remote_function_request(headers: Dict[str, str], entra_token_validator:
    TokenValidator | None) -> tuple[Optional[microsoft_teams.apps.contexts.client_context.ClientContext],
    Optional[str]]'
  parameters:
  - name: headers
    description: Request headers dict.
    isRequired: true
  - name: entra_token_validator
    description: TokenValidator instance for Entra ID tokens.
    isRequired: true
  return:
    description: Tuple of (ClientContext, None) on success or (None, error_message)
      on failure.
- uid: microsoft_teams.apps.validate_security_policy
  name: validate_security_policy
  summary: 'Validates that external references in widget HTML are covered by the

    declared security policy. Returns a list of warnings for any references

    to origins not present in the appropriate policy field.


    This is a static analysis tool - it cannot catch dynamically constructed URLs.

    Use the debug_csp_violations option on inject_widget_protocol for runtime detection.


    Diagnostic: ExperimentalTeamsHtmlWidget'
  signature: 'validate_security_policy(html: str, policy: HtmlWidgetSecurityPolicy)
    -> list[microsoft_teams.apps.utils.html_widget.SecurityPolicyWarning]'
  parameters:
  - name: html
    isRequired: true
  - name: policy
    isRequired: true

functions:
- uid: microsoft_teams.apps.Plugin
  name: Plugin
  summary: Turns any class into a plugin using the decorator pattern.
  signature: 'Plugin(name: str | None = None, version: str | None = None, description:
    str | None = None) -> Callable[[Type[T]], Type[T]]'
  parameters:
  - name: name
    defaultValue: None
  - name: version
    defaultValue: None
  - name: description
    defaultValue: None
- uid: microsoft_teams.apps.get_event_type_from_signature
  name: get_event_type_from_signature
  summary: Extract event type from function signature by inspecting the first parameter's
    type hint.
  signature: 'get_event_type_from_signature(func: Callable[[...], Any]) -> Literal[''activity'',
    ''error'', ''start'', ''stop'', ''sign_in'', ''activity_response'', ''activity_sent'']
    | str | None'
  parameters:
  - name: func
    description: Function to inspect
    isRequired: true
  return:
    description: Event type string if detectable, None otherwise
- uid: microsoft_teams.apps.get_metadata
  name: get_metadata
  summary: Get plugin metadata from a class.
  signature: 'get_metadata(cls: Type[PluginBase]) -> PluginOptions'
  parameters:
  - name: cls
    isRequired: true
- uid: microsoft_teams.apps.is_registered_event
  name: is_registered_event
  summary: Check if an event name is registered.
  signature: 'is_registered_event(event_name: str) -> bool'
  parameters:
  - name: event_name
    description: Event name to check
    isRequired: true
  return:
    description: True if registered, False otherwise
- uid: microsoft_teams.apps.to_threaded_conversation_id
  name: to_threaded_conversation_id
  summary: 'Construct a threaded conversation ID by appending *;messageid={message_id}*

    to the conversation ID. This is the format APX uses to route messages

    to a specific thread.'
  signature: 'to_threaded_conversation_id(conversation_id: str, message_id: str) ->
    str'
  parameters:
  - name: conversation_id
    description: The conversation to thread into (e.g. *19:abc@thread.skype*)
    isRequired: true
  - name: message_id
    description: The thread root message ID (must be a non-zero numeric string)
    isRequired: true
  return:
    description: <xref:mailto:abc@thread.skype>;messageid=123`)
    types:
    - <xref:The> <xref:threaded> <xref:conversation> <xref:ID> (<xref:e.g.> `<xref:19>
- uid: microsoft_teams.apps.validate_remote_function_request
  name: validate_remote_function_request
  summary: Validate JWT and extract client context from request headers for remote
    function calls.
  signature: 'async validate_remote_function_request(headers: Dict[str, str], entra_token_validator:
    TokenValidator | None) -> tuple[Optional[microsoft_teams.apps.contexts.client_context.ClientContext],
    Optional[str]]'
  parameters:
  - name: headers
    description: Request headers dict.
    isRequired: true
  - name: entra_token_validator
    description: TokenValidator instance for Entra ID tokens.
    isRequired: true
  return:
    description: Tuple of (ClientContext, None) on success or (None, error_message)
      on failure.

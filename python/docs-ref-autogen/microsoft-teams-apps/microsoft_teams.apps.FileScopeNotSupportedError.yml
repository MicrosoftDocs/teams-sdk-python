### YamlMime:PythonClass
uid: microsoft_teams.apps.FileScopeNotSupportedError
name: FileScopeNotSupportedError
fullName: microsoft_teams.apps.FileScopeNotSupportedError
module: microsoft_teams.apps
summary: 'Raised when file bytes are requested for a conversation scope whose download
  path is not implemented.


  *personal* (1:1) files download through either route. In *groupChat* and *channel*
  the platform delivers file

  attachments only to an agentic user, and they download only through Graph at this
  time. *list()* would still surface

  a pre-authorized *download_url*, but *download()*/*stream()* raises, as it does
  for any other scope.'
constructor:
  syntax: 'FileScopeNotSupportedError(scope: Literal[''personal'', ''groupChat'',
    ''channel''] | str, message: str | None = None)'
  parameters:
  - name: scope
    isRequired: true
  - name: message
    defaultValue: None
attributes:
- uid: microsoft_teams.apps.FileScopeNotSupportedError.scope
  name: scope
  summary: The conversation scope that is not yet fetchable.
  signature: 'scope: Literal[''personal'', ''groupChat'', ''channel''] | str'

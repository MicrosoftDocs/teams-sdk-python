methods:
- uid: microsoft_teams.apps.app_oauth.OauthHandlers.sign_in_failure
  name: sign_in_failure
  summary: "Default handler for signin/failure invoke activities.\n\nTeams sends a\
    \ signin/failure invoke when SSO token exchange fails\n(e.g., due to a misconfigured\
    \ Entra app registration). This handler\nlogs the failure details and emits an\
    \ error event so developers are\nnotified rather than having the failure silently\
    \ swallowed.\n\nKnown failure codes (sent by the Teams client):\n   * `installappfailed`:\
    \ Failed to install the app in the user's personal scope (non-silent). \n\n  \
    \ * `authrequestfailed`: The SSO auth request failed after app installation (non-silent).\
    \ \n\n   * `installedappnotfound`: The bot app is not installed for the user or\
    \ group chat. \n\n   * `invokeerror`: A generic error occurred during the SSO\
    \ invoke flow. \n\n   * `resourcematchfailed`: The token exchange resource URI\
    \ on the OAuthCard does not match the Application ID URI in the Entra app registration's\
    \ \"Expose an API\" section. \n\n   * `oauthcardnotvalid`: The bot's OAuthCard\
    \ could not be parsed. \n\n   * `tokenmissing`: AAD token acquisition failed.\
    \ \n\n   * `userconsentrequired`: The user needs to consent (handled via OAuth\
    \ card fallback, does not typically reach the bot). \n\n   * `interactionrequired`:\
    \ User interaction is required (handled via OAuth card fallback, does not typically\
    \ reach the bot)."
  signature: 'async sign_in_failure(ctx: ActivityContext[SignInFailureInvokeActivity])
    -> InvokeResponse[NoneType] | None'
  parameters:
  - name: ctx
    isRequired: true

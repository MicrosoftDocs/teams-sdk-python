### YamlMime:PythonClass
uid: microsoft_teams.apps.InboundActivityTokenValidator
name: InboundActivityTokenValidator
fullName: microsoft_teams.apps.InboundActivityTokenValidator
module: microsoft_teams.apps
summary: 'Validator for inbound Teams activities.


  Classic bot activities use Bot Framework connector tokens. Agent ID activities use

  Entra tokens whose audience is the Agent 365 app blueprint app ID.'
constructor:
  syntax: 'InboundActivityTokenValidator(app_id: str, cloud: CloudEnvironment | None
    = None)'
  parameters:
  - name: app_id
    isRequired: true
  - name: cloud
    defaultValue: None
methods:
- uid: microsoft_teams.apps.InboundActivityTokenValidator.validate_token
  name: validate_token
  signature: 'async validate_token(raw_token: str, service_url: str | None = None)
    -> Dict[str, Any]'
  parameters:
  - name: raw_token
    isRequired: true
  - name: service_url
    defaultValue: None

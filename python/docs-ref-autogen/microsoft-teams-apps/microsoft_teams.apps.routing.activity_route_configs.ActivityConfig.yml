### YamlMime:PythonClass
uid: microsoft_teams.apps.routing.activity_route_configs.ActivityConfig
name: ActivityConfig
fullName: microsoft_teams.apps.routing.activity_route_configs.ActivityConfig
module: microsoft_teams.apps.routing.activity_route_configs
summary: Configuration for an activity handler.
constructor:
  syntax: 'ActivityConfig(name: str, method_name: str, input_model: str | Type[Activity],
    selector: Callable[[Activity], bool], output_model: Type[CustomBaseModel] | None
    = None, output_type_name: str | None = None, is_invoke: bool = False)'
  parameters:
  - name: name
    isRequired: true
  - name: method_name
    isRequired: true
  - name: input_model
    isRequired: true
  - name: selector
    isRequired: true
  - name: output_model
    defaultValue: None
  - name: output_type_name
    defaultValue: None
  - name: is_invoke
    defaultValue: 'False'
attributes:
- uid: microsoft_teams.apps.routing.activity_route_configs.ActivityConfig.input_model
  name: input_model
  summary: The input activity class type.
  signature: 'input_model: str | Type[Activity]'
- uid: microsoft_teams.apps.routing.activity_route_configs.ActivityConfig.is_invoke
  name: is_invoke
  summary: Whether this config is for an invoke activity. Defaults to False.
  signature: 'is_invoke: bool = False'
- uid: microsoft_teams.apps.routing.activity_route_configs.ActivityConfig.method_name
  name: method_name
  summary: The generated method name (e.g., 'onMessage', 'onInvoke').
  signature: 'method_name: str'
- uid: microsoft_teams.apps.routing.activity_route_configs.ActivityConfig.name
  name: name
  summary: The activity type string (e.g., 'message', 'invoke').
  signature: 'name: str'
- uid: microsoft_teams.apps.routing.activity_route_configs.ActivityConfig.output_model
  name: output_model
  summary: The output model class type. None if no specific output type.
  signature: 'output_model: Type[CustomBaseModel] | None = None'
- uid: microsoft_teams.apps.routing.activity_route_configs.ActivityConfig.output_type_name
  name: output_type_name
  summary: Override for the output type name in generated code. If None, uses output_model.__name__.
  signature: 'output_type_name: str | None = None'
- uid: microsoft_teams.apps.routing.activity_route_configs.ActivityConfig.selector
  name: selector
  summary: Function that determines if this route matches the given activity.
  signature: 'selector: Callable[[Activity], bool]'

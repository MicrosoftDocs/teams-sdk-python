  name: to_threaded_conversation_id
  summary: 'Construct a threaded conversation ID by appending *;messageid={message_id}*

    to the conversation ID. This is the format APX uses to route messages

    to a specific thread.'
  signature: 'to_threaded_conversation_id(conversation_id: str, message_id: str) ->
    str'
  parameters:
  - name: conversation_id
    description: The conversation to thread into (e.g. *19:abc@thread.skype*)
    isRequired: true
  - name: message_id
    description: The thread root message ID (must be a non-zero numeric string)
    isRequired: true

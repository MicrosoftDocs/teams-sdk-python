### YamlMime:PythonClass
uid: microsoft_teams.apps.contexts.client_context.ClientContext
name: ClientContext
fullName: microsoft_teams.apps.contexts.client_context.ClientContext
module: microsoft_teams.apps.contexts.client_context
summary: Runtime information about the client and session in Microsoft Teams.
constructor:
  syntax: 'ClientContext(app_session_id: str, tenant_id: str, user_id: str, user_name:
    str, page_id: str, auth_token: str, app_id: str | None = None, team_id: str |
    None = None, message_id: str | None = None, channel_id: str | None = None, chat_id:
    str | None = None, meeting_id: str | None = None, sub_page_id: str | None = None,
    _resolved_conversation_id: str | None = None)'
  parameters:
  - name: app_session_id
    isRequired: true
  - name: tenant_id
    isRequired: true
  - name: user_id
    isRequired: true
  - name: user_name
    isRequired: true
  - name: page_id
    isRequired: true
  - name: auth_token
    isRequired: true
  - name: app_id
    defaultValue: None
  - name: team_id
    defaultValue: None
  - name: message_id
    defaultValue: None
  - name: channel_id
    defaultValue: None
  - name: chat_id
    defaultValue: None
  - name: meeting_id
    defaultValue: None
  - name: sub_page_id
    defaultValue: None
  - name: _resolved_conversation_id
    defaultValue: None
attributes:
- uid: microsoft_teams.apps.contexts.client_context.ClientContext.app_id
  name: app_id
  summary: 'This ID is the unique identifier assigned to the app after deployment
    and is critical for ensuring the correct

    app instance is recognized across hosts.'
  signature: 'app_id: str | None = None'
- uid: microsoft_teams.apps.contexts.client_context.ClientContext.app_session_id
  name: app_session_id
  summary: 'Unique ID for the current session for use in correlating telemetry data.

    A session corresponds to the lifecycle of an app.

    A new session begins upon the creation of a webview (on Teams mobile) or iframe
    (in Teams desktop) hosting the app,

    and ends when it is destroyed.'
  signature: 'app_session_id: str'
- uid: microsoft_teams.apps.contexts.client_context.ClientContext.auth_token
  name: auth_token
  summary: The MSAL Entra token.
  signature: 'auth_token: str'
- uid: microsoft_teams.apps.contexts.client_context.ClientContext.channel_id
  name: channel_id
  summary: The Microsoft Teams ID for the channel with which the content is associated.
  signature: 'channel_id: str | None = None'
- uid: microsoft_teams.apps.contexts.client_context.ClientContext.chat_id
  name: chat_id
  summary: The Microsoft Teams ID for the chat with which the content is associated.
  signature: 'chat_id: str | None = None'
- uid: microsoft_teams.apps.contexts.client_context.ClientContext.conversation_id
  name: conversation_id
  summary: The Microsoft Teams ID for the conversation with which the content is associated.
- uid: microsoft_teams.apps.contexts.client_context.ClientContext.meeting_id
  name: meeting_id
  summary: Meeting ID used by tab when running in meeting context.
  signature: 'meeting_id: str | None = None'
- uid: microsoft_teams.apps.contexts.client_context.ClientContext.message_id
  name: message_id
  summary: 'The ID of the parent message from which this task module was launched.

    This is only available in task modules launched from bot cards.'
  signature: 'message_id: str | None = None'
- uid: microsoft_teams.apps.contexts.client_context.ClientContext.page_id
  name: page_id
  summary: The developer-defined unique ID for the page this content points to.
  signature: 'page_id: str'
- uid: microsoft_teams.apps.contexts.client_context.ClientContext.sub_page_id
  name: sub_page_id
  summary: 'The developer-defined unique ID for the sub-page this content points to.

    This field should be used to restore to a specific state within a page,

    such as scrolling to or activating a specific piece of content.'
  signature: 'sub_page_id: str | None = None'
- uid: microsoft_teams.apps.contexts.client_context.ClientContext.team_id
  name: team_id
  summary: The Microsoft Teams ID for the team with which the content is associated.
  signature: 'team_id: str | None = None'
- uid: microsoft_teams.apps.contexts.client_context.ClientContext.tenant_id
  name: tenant_id
  summary: The Microsoft Entra tenant ID of the current user, extracted from request
    auth token.
  signature: 'tenant_id: str'
- uid: microsoft_teams.apps.contexts.client_context.ClientContext.user_id
  name: user_id
  summary: The Microsoft Entra object ID of the current user, extracted from the request
    auth token.
  signature: 'user_id: str'
- uid: microsoft_teams.apps.contexts.client_context.ClientContext.user_name
  name: user_name
  summary: The name of the current user, extracted from the request auth token.
  signature: 'user_name: str'

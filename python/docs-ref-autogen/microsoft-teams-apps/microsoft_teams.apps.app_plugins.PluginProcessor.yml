### YamlMime:PythonClass
uid: microsoft_teams.apps.app_plugins.PluginProcessor
name: PluginProcessor
fullName: microsoft_teams.apps.app_plugins.PluginProcessor
module: microsoft_teams.apps.app_plugins
summary: 'Processes plugins as apart of the Teams app.


  This class is responsible for initializing plugins, injecting dependencies, and
  handling events.

  It uses dependency injection to provide plugins with the necessary dependencies
  and event handlers.'
constructor:
  syntax: 'PluginProcessor(container: Container, event_manager: EventManager, event_emitter:
    EventEmitter[Literal[''activity'', ''error'', ''start'', ''stop'', ''sign_in'',
    ''activity_response'', ''activity_sent''] | str], activity_processor: ActivityProcessor)'
  parameters:
  - name: container
    isRequired: true
  - name: event_manager
    isRequired: true
  - name: event_emitter
    isRequired: true
  - name: activity_processor
    isRequired: true
methods:
- uid: microsoft_teams.apps.app_plugins.PluginProcessor.get_plugin
  name: get_plugin
  summary: Gets the plugin by name.
  signature: 'get_plugin(name: str) -> PluginBase | None'
  parameters:
  - name: name
    isRequired: true
- uid: microsoft_teams.apps.app_plugins.PluginProcessor.initialize_plugins
  name: initialize_plugins
  summary: Initializes and adds all the plugins for the app.
  signature: 'initialize_plugins(plugins: List[PluginBase]) -> List[PluginBase]'
  parameters:
  - name: plugins
    isRequired: true
- uid: microsoft_teams.apps.app_plugins.PluginProcessor.inject
  name: inject
  summary: Injects dependencies and events into the plugin.
  signature: 'inject(plugin: PluginBase) -> None'
  parameters:
  - name: plugin
    isRequired: true

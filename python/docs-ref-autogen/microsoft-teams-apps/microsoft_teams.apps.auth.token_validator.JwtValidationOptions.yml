### YamlMime:PythonClass
uid: microsoft_teams.apps.auth.token_validator.JwtValidationOptions
name: JwtValidationOptions
fullName: microsoft_teams.apps.auth.token_validator.JwtValidationOptions
module: microsoft_teams.apps.auth.token_validator
summary: Configuration for JWT validation.
constructor:
  syntax: 'JwtValidationOptions(valid_issuers: List[str], valid_audiences: List[str],
    jwks_uri: str, service_url: str | None = None, scope: str | None = None, clock_tolerance:
    int = 300)'
  parameters:
  - name: valid_issuers
    isRequired: true
  - name: valid_audiences
    isRequired: true
  - name: jwks_uri
    isRequired: true
  - name: service_url
    defaultValue: None
  - name: scope
    defaultValue: None
  - name: clock_tolerance
    defaultValue: '300'
attributes:
- uid: microsoft_teams.apps.auth.token_validator.JwtValidationOptions.clock_tolerance
  name: clock_tolerance
  summary: Allowable clock skew when validating JWTs
  signature: 'clock_tolerance: int = 300'
- uid: microsoft_teams.apps.auth.token_validator.JwtValidationOptions.jwks_uri
  name: jwks_uri
  summary: URI to the JSON Web Key Set (JWKS) for token signature verification
  signature: 'jwks_uri: str'
- uid: microsoft_teams.apps.auth.token_validator.JwtValidationOptions.scope
  name: scope
  summary: Optional scope that must be present in the token
  signature: 'scope: str | None = None'
- uid: microsoft_teams.apps.auth.token_validator.JwtValidationOptions.service_url
  name: service_url
  summary: Optional service URL to validate against token claims
  signature: 'service_url: str | None = None'
- uid: microsoft_teams.apps.auth.token_validator.JwtValidationOptions.valid_audiences
  name: valid_audiences
  summary: List of valid audiences for the JWT
  signature: 'valid_audiences: List[str]'
- uid: microsoft_teams.apps.auth.token_validator.JwtValidationOptions.valid_issuers
  name: valid_issuers
  summary: List of valid issuers for the JWT
  signature: 'valid_issuers: List[str]'

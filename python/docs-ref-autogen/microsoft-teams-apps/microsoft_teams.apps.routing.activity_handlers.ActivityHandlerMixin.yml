### YamlMime:PythonClass
uid: microsoft_teams.apps.routing.activity_handlers.ActivityHandlerMixin
name: ActivityHandlerMixin
fullName: microsoft_teams.apps.routing.activity_handlers.ActivityHandlerMixin
module: microsoft_teams.apps.routing.activity_handlers
summary: Mixin class providing typed activity handler registration methods.
constructor:
  syntax: ActivityHandlerMixin()
methods:
- uid: microsoft_teams.apps.routing.activity_handlers.ActivityHandlerMixin.on_card_action_execute
  name: on_card_action_execute
  summary: 'Register a handler for Action.Execute card actions.


    This handler provides action-based routing for ExecuteAction (Action.Execute)
    buttons.

    Only Action.Execute is supported - Action.Submit and other action types do not
    trigger

    AdaptiveCardInvokeActivity in modern Teams clients.'
  signature: on_card_action_execute() -> Callable[[InvokeHandler[AdaptiveCardInvokeActivity,
    AdaptiveCardInvokeResponse]], InvokeHandler[AdaptiveCardInvokeActivity, AdaptiveCardInvokeResponse]]
  parameters:
  - name: action_or_handler
    description: 'Optional action identifier to match against the ''action'' field
      in activity data,

      or a handler function to match all Action.Execute events.'
    defaultValue: None
  - name: handler
    description: The async function to call when the event matches
    defaultValue: None
  return:
    description: Decorated function or decorator
- uid: microsoft_teams.apps.routing.activity_handlers.ActivityHandlerMixin.on_dialog_open
  name: on_dialog_open
  summary: Register a dialog open handler.
  signature: on_dialog_open() -> Callable[[InvokeHandler[TaskFetchInvokeActivity,
    TaskModuleInvokeResponse]], InvokeHandler[TaskFetchInvokeActivity, TaskModuleInvokeResponse]]
  parameters:
  - name: dialog_id_or_handler
    description: 'Optional dialog identifier to match against the ''dialog_id'' field
      in activity data,

      or a handler function to match all dialog open events.'
    defaultValue: None
  - name: handler
    description: The async function to call when the event matches
    defaultValue: None
  return:
    description: Decorated function or decorator
- uid: microsoft_teams.apps.routing.activity_handlers.ActivityHandlerMixin.on_dialog_submit
  name: on_dialog_submit
  summary: Register a dialog submit handler.
  signature: on_dialog_submit() -> Callable[[InvokeHandler[TaskSubmitInvokeActivity,
    TaskModuleInvokeResponse]], InvokeHandler[TaskSubmitInvokeActivity, TaskModuleInvokeResponse]]
  parameters:
  - name: action_or_handler
    description: 'Optional action identifier to match against the ''action'' field
      in activity data,

      or a handler function to match all dialog submit events.'
    defaultValue: None
  - name: handler
    description: The async function to call when the event matches
    defaultValue: None
  return:
    description: Decorated function or decorator
- uid: microsoft_teams.apps.routing.activity_handlers.ActivityHandlerMixin.on_message_pattern
  name: on_message_pattern
  summary: Register a message handler that matches a specific text pattern.
  signature: 'on_message_pattern(pattern: str | Pattern[str]) -> Callable[[Callable[[ActivityContext[MessageActivity]],
    Awaitable[None]]], Callable[[ActivityContext[MessageActivity]], Awaitable[None]]]'
  parameters:
  - name: pattern
    description: The regex pattern to match against incoming messages
    isRequired: true
  - name: handler
    description: The async function to call when the pattern matches
    defaultValue: None
  return:
    description: Decorated function or decorator

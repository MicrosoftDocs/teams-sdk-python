### YamlMime:PythonClass
uid: microsoft_teams.apps.activity_sender.ActivitySender
name: ActivitySender
fullName: microsoft_teams.apps.activity_sender.ActivitySender
module: microsoft_teams.apps.activity_sender
summary: 'Handles sending activities to the Bot Framework.

  Separate from transport concerns (HTTP, WebSocket, etc.)


  Initialize ActivitySender.'
constructor:
  syntax: 'ActivitySender(client: Client)'
  parameters:
  - name: client
    description: HTTP client with token provider configured
    isRequired: true
methods:
- uid: microsoft_teams.apps.activity_sender.ActivitySender.create_stream
  name: create_stream
  summary: Create a new activity stream for real-time updates.
  signature: 'create_stream(ref: ConversationReference) -> StreamerProtocol'
  parameters:
  - name: ref
    description: The conversation reference
    isRequired: true
  return:
    description: A new streaming instance
- uid: microsoft_teams.apps.activity_sender.ActivitySender.send
  name: send
  summary: Send an activity to the Bot Framework.
  signature: 'async send(activity: MessageActivityInput | MessageReactionActivityInput
    | TypingActivityInput, ref: ConversationReference) -> SentActivity'
  parameters:
  - name: activity
    description: The activity to send
    isRequired: true
  - name: ref
    description: The conversation reference
    isRequired: true
  return:
    description: The sent activity with id and other server-populated fields

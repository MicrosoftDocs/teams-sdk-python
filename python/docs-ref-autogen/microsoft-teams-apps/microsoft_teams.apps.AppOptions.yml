### YamlMime:PythonClass
uid: microsoft_teams.apps.AppOptions
name: AppOptions
fullName: microsoft_teams.apps.AppOptions
module: microsoft_teams.apps
summary: Configuration options for the Teams App.
constructor:
  syntax: AppOptions()
attributes:
- uid: microsoft_teams.apps.AppOptions.api_client_settings
  name: api_client_settings
  summary: API client settings used for overriding.
  signature: 'api_client_settings: ApiClientSettings | None'
- uid: microsoft_teams.apps.AppOptions.application_id_uri
  name: application_id_uri
  summary: 'Application ID URI from the Azure portal. Used for user authentication.

    Matches webApplicationInfo.resource in the app manifest.'
  signature: 'application_id_uri: str | None'
- uid: microsoft_teams.apps.AppOptions.client
  name: client
  summary: 'HTTP client or client options used to make API requests.

    Accepts a Client instance or ClientOptions. The app always injects its own User-Agent
    header.'
  signature: 'client: Client | ClientOptions | None'
- uid: microsoft_teams.apps.AppOptions.client_id
  name: client_id
  summary: The client ID of the app registration.
  signature: 'client_id: str | None'
- uid: microsoft_teams.apps.AppOptions.client_secret
  name: client_secret
  summary: The client secret. If provided with client_id, uses ClientCredentials auth.
  signature: 'client_secret: str | None'
- uid: microsoft_teams.apps.AppOptions.cloud
  name: cloud
  summary: 'Cloud environment for sovereign cloud support.

    Accepts a CloudEnvironment instance or uses CLOUD environment variable.

    Valid env var values: "Public", "USGov", "USGovDoD", "China".

    Defaults to PUBLIC (commercial cloud).'
  signature: 'cloud: CloudEnvironment | None'
- uid: microsoft_teams.apps.AppOptions.default_connection_name
  name: default_connection_name
  summary: The OAuth connection name to use for authentication. Defaults to 'graph'.
  signature: 'default_connection_name: str | None'
- uid: microsoft_teams.apps.AppOptions.http_server_adapter
  name: http_server_adapter
  summary: Custom HTTP server adapter. Defaults to FastAPIAdapter if not provided.
  signature: 'http_server_adapter: HttpServerAdapter | None'
- uid: microsoft_teams.apps.AppOptions.managed_identity_client_id
  name: managed_identity_client_id
  summary: 'The managed identity client ID for user-assigned managed identity.

    Set to "system" for system-assigned managed identity (triggers Federated Identity
    Credentials).

    If set to a different client ID than client_id, triggers Federated Identity Credentials
    with user-assigned MI.

    If not set or equals client_id, uses direct managed identity (no federation).'
  signature: 'managed_identity_client_id: str | None'
- uid: microsoft_teams.apps.AppOptions.messaging_endpoint
  name: messaging_endpoint
  summary: URL path for the Teams messaging endpoint. Defaults to '/api/messages'.
  signature: 'messaging_endpoint: str | None'
- uid: microsoft_teams.apps.AppOptions.service_url
  name: service_url
  summary: 'Base Service URL for BotBackend.

    Uses environment variable SERVICE_URL if not provided

    and defaults to [https://smba.trafficmanager.net/teams](https://smba.trafficmanager.net/teams)'
  signature: 'service_url: str | None'
- uid: microsoft_teams.apps.AppOptions.tenant_id
  name: tenant_id
  summary: The tenant ID. Required for single-tenant apps.
  signature: 'tenant_id: str | None'
- uid: microsoft_teams.apps.AppOptions.token
  name: token
  summary: Custom token provider function. If provided with client_id (no client_secret),
    uses TokenCredentials.
  signature: 'token: Callable[[str | list[str], str | None], str | Awaitable[str]]
    | None'
- uid: microsoft_teams.apps.AppOptions.plugins
  name: plugins
  signature: 'plugins: List[PluginBase] | None'
- uid: microsoft_teams.apps.AppOptions.skip_auth
  name: skip_auth
  signature: 'skip_auth: bool | None'
- uid: microsoft_teams.apps.AppOptions.storage
  name: storage
  signature: 'storage: Storage[str, Any] | None'

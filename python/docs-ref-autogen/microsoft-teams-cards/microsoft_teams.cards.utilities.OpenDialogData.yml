### YamlMime:PythonClass
uid: microsoft_teams.cards.utilities.OpenDialogData
name: OpenDialogData
fullName: microsoft_teams.cards.utilities.OpenDialogData
module: microsoft_teams.cards.utilities
summary: 'Represents the data required to open a dialog in Microsoft Teams using a
  submit action.


  This class extends *SubmitActionData* and is used to construct the payload for opening
  a dialog,

  including a reserved dialog identifier and any additional data.


  Initialize an OpenDialogData instance.'
constructor:
  syntax: 'OpenDialogData(dialog_identifier: str, extra_data: Dict[str, Any] | None
    = None)'
  parameters:
  - name: dialog_identifier
    description: The unique identifier for the dialog to open.
    isRequired: true
    types:
    - <xref:str>
  - name: extra_data
    description: Optional additional data to include in the payload.
    defaultValue: None
    types:
    - '<xref:Dict>[<xref:str>,<xref: Any>]<xref: | None>'
  - name: dialog_identifier
    description: The unique identifier for the dialog to open.
    isRequired: true
    types:
    - <xref:str>
  - name: extra_data
    description: Optional additional data to include in the payload.
    isRequired: true
    types:
    - '<xref:Dict>[<xref:str>,<xref: Any>]<xref: | None>'
examples:
- '

  ```


  >>> data = OpenDialogData("myDialogId", {"foo": "bar"})

  >>> # Use `data` as the payload for a Teams card submit action to open a dialog.

  ```

  '

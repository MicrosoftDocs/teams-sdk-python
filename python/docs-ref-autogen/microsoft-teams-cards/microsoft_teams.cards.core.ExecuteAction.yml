  - name: title
    defaultValue: None
  - name: iconUrl
    defaultValue: None
  - name: style
    defaultValue: default
  - name: mode
    defaultValue: primary
  - name: tooltip
    defaultValue: None
  - name: isEnabled
    defaultValue: 'True'
  - name: menuActions

- uid: microsoft_teams.cards.core.ExecuteAction.data
  name: data
  summary: The data to send to the Bot when the action is executed. When expressed
    as an object, *data* is sent back to the Bot when the action is executed, adorned
    with the values of the inputs expressed as key/value pairs, where the key is the
    Id of the input. If *data* is expressed as a string, input values are not sent
    to the Bot.
  signature: 'data: str | SubmitActionData | Dict[str, Any] | None'
- uid: microsoft_teams.cards.core.ExecuteAction.fallback
  name: fallback
  summary: An alternate action to render if the type of this one is unsupported or
    if the host application doesn't support all the capabilities specified in the
    requires property.
  signature: 'fallback: Action | Literal[''drop''] | None'
- uid: microsoft_teams.cards.core.ExecuteAction.icon_url
  name: icon_url
  summary: 'A URL (or Base64-encoded Data URI) to a PNG, GIF, JPEG or SVG image to
    be displayed on the left of the action''s title.


    *iconUrl* also accepts the *<icon-name>[,regular|filled]* format to display an
    icon from the vast [Adaptive Card icon catalog](topic:icon-catalog) instead of
    an image.'
  signature: 'icon_url: str | None'
- uid: microsoft_teams.cards.core.ExecuteAction.id
  name: id
  summary: A unique identifier for the element or action. Input elements must have
    an id, otherwise they will not be validated and their values will not be sent
    to the Bot.
  signature: 'id: str | None'
- uid: microsoft_teams.cards.core.ExecuteAction.is_enabled

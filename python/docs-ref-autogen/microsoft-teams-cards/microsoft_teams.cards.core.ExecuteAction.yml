### YamlMime:PythonClass
uid: microsoft_teams.cards.core.ExecuteAction
name: ExecuteAction
fullName: microsoft_teams.cards.core.ExecuteAction
module: microsoft_teams.cards.core
summary: 'Gathers input values, merges them with the data property if specified, and
  sends them to the Bot via an Invoke activity. The Bot can respond synchronously
  and return an updated Adaptive Card to be displayed by the client. Action.Execute
  works in all Adaptive Card hosts.


  Create a new model by parsing and validating input data from keyword arguments.


  Raises [*ValidationError*][pydantic_core.ValidationError] if the input data cannot
  be

  validated to form a valid model.


  *self* is explicitly positional-only to allow *self* as a field name.'
constructor:
  syntax: 'ExecuteAction(*, key: str | None = None, type: ~typing.Literal[''Action.Execute'']
    = ''Action.Execute'', id: str | None = None, requires: ~microsoft_teams.cards.core.HostCapabilities
    | ~typing.Dict[str, ~typing.Any] | None = <factory>, title: str | None = None,
    iconUrl: str | None = None, style: ~typing.Literal[''default'', ''positive'',
    ''destructive''] | None = ''default'', mode: ~typing.Literal[''primary'', ''secondary'']
    | None = ''primary'', tooltip: str | None = None, isEnabled: bool | None = True,
    menuActions: ~typing.List[~microsoft_teams.cards.core.Action] | None = None, themedIconUrls:
    ~typing.List[~microsoft_teams.cards.core.ThemedUrl] | None = None, data: str |
    ~microsoft_teams.cards.core.SubmitActionData | ~typing.Dict[str, ~typing.Any]
    | None = None, associatedInputs: ~typing.Literal[''auto'', ''none''] | None =
    None, conditionallyEnabled: bool | None = False, verb: str | None = None, fallback:
    ~microsoft_teams.cards.core.Action | ~typing.Literal[''drop''] | None = None,
    **extra_data: ~typing.Any)'
  keywordOnlyParameters:
  - name: key
    defaultValue: None
  - name: type
    defaultValue: Action.Execute
  - name: id
    defaultValue: None
  - name: requires

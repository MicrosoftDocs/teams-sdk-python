### YamlMime:PythonClass
uid: microsoft_teams.cards.utilities.SubmitData
name: SubmitData
fullName: microsoft_teams.cards.utilities.SubmitData
module: microsoft_teams.cards.utilities
summary: 'Utility class for creating submit data with action-based routing.


  This class extends the base `SubmitActionData` (`microsoft_teams.cards.core.SubmitActionData`)

  with a convenience constructor that accepts an `action` identifier, which is used
  by

  `@app.on_dialog_submit("action")` for routing. The base class is a plain data container

  with no routing support.'
constructor:
  syntax: 'SubmitData(action: str | None = None, data: Dict[str, Any] | None = None,
    *, key: str | None = None, msteams: Dict[str, Any] | None = None, **kwargs: Any)'
  parameters:
  - name: action
    description: The action identifier that determines which handler processes the
      submission.
    defaultValue: None
  - name: data
    description: Optional additional data to include with the submission.
    defaultValue: None
  keywordOnlyParameters:
  - name: key
    defaultValue: None
  - name: msteams
    defaultValue: None
examples:
- '

  ```


  >>> submit_data = SubmitData(action="submit_user_form", data={"user_id": "123"})

  >>> submit_action = SubmitAction(title="Submit").with_data(submit_data)

  ```

  '

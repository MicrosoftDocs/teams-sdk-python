  summary: The maximum width of the popover in pixels, in the *<number>px* format
  signature: 'max_popover_width: str | None'
- uid: microsoft_teams.cards.core.PopoverAction.mode
  name: mode
  summary: Controls if the action is primary or secondary. Secondary actions appear
    in an overflow menu.
  signature: 'mode: Literal[''primary'', ''secondary''] | None'

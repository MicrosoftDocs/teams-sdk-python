attributes:
- uid: microsoft_teams.cards.core.PopoverAction.content
  name: content
  summary: The content of the popover, which can be any element.
  signature: 'content: CardElement | None'
- uid: microsoft_teams.cards.core.PopoverAction.display_arrow
  name: display_arrow
  summary: Controls if an arrow should be displayed towards the element that triggered
    the popover.
  signature: 'display_arrow: bool | None'
- uid: microsoft_teams.cards.core.PopoverAction.fallback
  name: fallback
  summary: An alternate action to render if the type of this one is unsupported or
    if the host application doesn't support all the capabilities specified in the
    requires property.
  signature: 'fallback: Action | Literal[''drop''] | None'
- uid: microsoft_teams.cards.core.PopoverAction.icon_url
  name: icon_url
  summary: 'A URL (or Base64-encoded Data URI) to a PNG, GIF, JPEG or SVG image to
    be displayed on the left of the action''s title.


    *iconUrl* also accepts the *<icon-name>[,regular|filled]* format to display an
    icon from the vast [Adaptive Card icon catalog](topic:icon-catalog) instead of
    an image.'
  signature: 'icon_url: str | None'
- uid: microsoft_teams.cards.core.PopoverAction.id
  name: id
  summary: A unique identifier for the element or action. Input elements must have
    an id, otherwise they will not be validated and their values will not be sent
    to the Bot.
  signature: 'id: str | None'
- uid: microsoft_teams.cards.core.PopoverAction.is_enabled
  name: is_enabled
  summary: Controls the enabled state of the action. A disabled action cannot be clicked.
    If the action is represented as a button, the button's style will reflect this
    state.
  signature: 'is_enabled: bool | None'
- uid: microsoft_teams.cards.core.PopoverAction.key
  name: key
  summary: Defines an optional key for the object. Keys are seldom needed, but in
    some scenarios, specifying keys can help maintain visual state in the host application.
  signature: 'key: str | None'
- uid: microsoft_teams.cards.core.PopoverAction.max_popover_width

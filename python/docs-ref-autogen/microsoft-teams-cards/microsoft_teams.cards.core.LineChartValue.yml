- uid: microsoft_teams.cards.core.LineChartValue.x
  name: x
  summary: 'The x axis value of the data point.


    If all x values of the x [Chart.Line](topic:Chart.Line) are expressed as a number,
    or if all x values are expressed as a date string in the *YYYY-MM-DD* format,
    the chart will be rendered as a time series chart, i.e. x axis values will span
    across the minimum x value to maximum x value range.


    Otherwise, if x values are represented as a mix of numbers and strings or if at
    least one x value isn''t in the *YYYY-MM-DD* format, the chart will be rendered
    as a categorical chart, i.e. x axis values will be displayed as categories.'
  signature: 'x: str | float | None'
- uid: microsoft_teams.cards.core.LineChartValue.y
  name: y
  summary: The y axis value of the data point.
  signature: 'y: float | None'

uid: microsoft_teams.cards.core.LineChartValue
name: LineChartValue
fullName: microsoft_teams.cards.core.LineChartValue
module: microsoft_teams.cards.core
summary: 'Represents a single data point in a line chart.


  Create a new model by parsing and validating input data from keyword arguments.


  Raises [*ValidationError*][pydantic_core.ValidationError] if the input data cannot
  be

  validated to form a valid model.


  *self* is explicitly positional-only to allow *self* as a field name.'
constructor:
  syntax: 'LineChartValue(*, key: str | None = None, x: str | float | None = None,
    y: float | None = 0, **extra_data: Any)'
  keywordOnlyParameters:
  - name: key
    defaultValue: None
  - name: x
    defaultValue: None
  - name: y
    defaultValue: '0'
methods:
- uid: microsoft_teams.cards.core.LineChartValue.with_key
  name: with_key
  signature: 'with_key(value: str) -> Self'
  parameters:
  - name: value
    isRequired: true
- uid: microsoft_teams.cards.core.LineChartValue.with_x
  name: with_x
  signature: 'with_x(value: float | str) -> Self'
  parameters:
  - name: value

### YamlMime:PythonClass
uid: microsoft_teams.cards.core.QueryData
name: QueryData
fullName: microsoft_teams.cards.core.QueryData
module: microsoft_teams.cards.core
summary: 'Defines a query to dynamically fetch data from a Bot.


  Create a new model by parsing and validating input data from keyword arguments.


  Raises [*ValidationError*][pydantic_core.ValidationError] if the input data cannot
  be

  validated to form a valid model.


  *self* is explicitly positional-only to allow *self* as a field name.'
constructor:
  syntax: 'QueryData(*, key: str | None = None, type: Literal[''Data.Query''] = ''Data.Query'',
    dataset: str | None = None, associatedInputs: Literal[''auto'', ''none''] | None
    = None, count: float | None = None, skip: float | None = None, **extra_data: Any)'
  keywordOnlyParameters:
  - name: key
    defaultValue: None
  - name: type
    defaultValue: Data.Query
  - name: dataset
    defaultValue: None
  - name: associatedInputs
    defaultValue: None
  - name: count
    defaultValue: None
  - name: skip
    defaultValue: None
methods:
- uid: microsoft_teams.cards.core.QueryData.with_associated_inputs
  name: with_associated_inputs
  signature: 'with_associated_inputs(value: Literal[''auto'', ''none'']) -> Self'
  parameters:
  - name: value
    isRequired: true
- uid: microsoft_teams.cards.core.QueryData.with_count
  name: with_count
  signature: 'with_count(value: float) -> Self'
  parameters:
  - name: value
    isRequired: true
- uid: microsoft_teams.cards.core.QueryData.with_dataset

attributes:
- uid: microsoft_teams.cards.core.ToggleVisibilityAction.fallback
  name: fallback
  summary: An alternate action to render if the type of this one is unsupported or
    if the host application doesn't support all the capabilities specified in the
    requires property.
  signature: 'fallback: Action | Literal[''drop''] | None'
- uid: microsoft_teams.cards.core.ToggleVisibilityAction.icon_url
  name: icon_url
  summary: 'A URL (or Base64-encoded Data URI) to a PNG, GIF, JPEG or SVG image to
    be displayed on the left of the action''s title.


    *iconUrl* also accepts the *<icon-name>[,regular|filled]* format to display an
    icon from the vast [Adaptive Card icon catalog](topic:icon-catalog) instead of
    an image.'
  signature: 'icon_url: str | None'
- uid: microsoft_teams.cards.core.ToggleVisibilityAction.id
  name: id
  summary: A unique identifier for the element or action. Input elements must have
    an id, otherwise they will not be validated and their values will not be sent
    to the Bot.
  signature: 'id: str | None'
- uid: microsoft_teams.cards.core.ToggleVisibilityAction.is_enabled
  name: is_enabled
  summary: Controls the enabled state of the action. A disabled action cannot be clicked.
    If the action is represented as a button, the button's style will reflect this
    state.
  signature: 'is_enabled: bool | None'
- uid: microsoft_teams.cards.core.ToggleVisibilityAction.key

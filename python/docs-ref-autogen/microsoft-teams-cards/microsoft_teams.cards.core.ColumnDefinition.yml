- uid: microsoft_teams.cards.core.ColumnDefinition.width
  name: width
  summary: The width of the column in the table. If expressed as a number, represents
    the relative weight of the column in the table. If expressed as a string, *auto*
    will automatically adjust the column's width according to its content and using
    the *<number>px* format will give the column an explicit width in pixels.
  signature: 'width: str | float | None'

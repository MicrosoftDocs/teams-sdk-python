attributes:
- uid: microsoft_teams.cards.core.ColumnDefinition.horizontal_cell_content_alignment
  name: horizontal_cell_content_alignment
  summary: Controls how the content of every cell in the table should be horizontally
    aligned by default. This property overrides the horizontalCellContentAlignment
    property of the table.
  signature: 'horizontal_cell_content_alignment: Literal[''Left'', ''Center'', ''Right'']
    | None'
- uid: microsoft_teams.cards.core.ColumnDefinition.key
  name: key
  summary: Defines an optional key for the object. Keys are seldom needed, but in
    some scenarios, specifying keys can help maintain visual state in the host application.
  signature: 'key: str | None'
- uid: microsoft_teams.cards.core.ColumnDefinition.model_config

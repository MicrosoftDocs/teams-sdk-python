  summary: Configuration for the model, should be a dictionary conforming to [*ConfigDict*][pydantic.config.ConfigDict].
  signature: 'model_config: ClassVar[ConfigDict] = {''alias_generator'': AliasGenerator(alias=None,
    validation_alias=<staticmethod(<function SerializableObject.validation_alias_generator>)>,
    serialization_alias=<staticmethod(<function SerializableObject.serialization_alias_generator>)>),
    ''arbitrary_types_allowed'': True, ''extra'': ''allow'', ''populate_by_name'':

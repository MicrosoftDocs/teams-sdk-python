- uid: microsoft_teams.api.clients.conversation.ConversationActivityClient.get_members
  name: get_members
  summary: Get the members associated with an activity.
  signature: 'async get_members(conversation_id: str, activity_id: str) -> List[TeamsChannelAccount]'
  parameters:
  - name: conversation_id
    description: The ID of the conversation
    isRequired: true
  - name: activity_id
    description: The ID of the activity
    isRequired: true
  return:
    description: List of TeamsChannelAccount objects representing the activity members
- uid: microsoft_teams.api.clients.conversation.ConversationActivityClient.reply
  name: reply
  summary: Reply to an activity in a conversation.
  signature: 'async reply(conversation_id: str, activity_id: str, activity: MessageActivityInput
    | MessageReactionActivityInput | TypingActivityInput) -> SentActivity'
  parameters:
  - name: conversation_id

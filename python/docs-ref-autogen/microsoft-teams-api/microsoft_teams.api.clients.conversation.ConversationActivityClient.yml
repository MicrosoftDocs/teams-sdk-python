### YamlMime:PythonClass
uid: microsoft_teams.api.clients.conversation.ConversationActivityClient
name: ConversationActivityClient
fullName: microsoft_teams.api.clients.conversation.ConversationActivityClient
module: microsoft_teams.api.clients.conversation
summary: 'Client for managing activities in a Teams conversation.


  Initialize the conversation activity client.'
constructor:
  syntax: 'ConversationActivityClient(service_url: str, http_client: Client | None
    = None, api_client_settings: ApiClientSettings | None = None)'
  parameters:
  - name: service_url
    description: The base URL for the Teams service
    isRequired: true
  - name: http_client
    description: Optional HTTP client to use. If not provided, a new one will be created.
    defaultValue: None
  - name: api_client_settings
    description: Optional API client settings.
    defaultValue: None
methods:
- uid: microsoft_teams.api.clients.conversation.ConversationActivityClient.create
  name: create
  summary: Create a new activity in a conversation.
  signature: 'async create(conversation_id: str, activity: MessageActivityInput |
    MessageReactionActivityInput | TypingActivityInput) -> SentActivity'
  parameters:
  - name: conversation_id
    description: The ID of the conversation
    isRequired: true
  - name: activity
    description: The activity to create
    isRequired: true
  return:
    description: The created activity
- uid: microsoft_teams.api.clients.conversation.ConversationActivityClient.create_targeted
  name: create_targeted
  summary: 'Create a new targeted activity in a conversation.


    Targeted activities are only visible to the specified recipient.



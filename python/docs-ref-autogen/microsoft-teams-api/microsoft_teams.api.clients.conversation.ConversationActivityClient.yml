    description: The ID of the conversation
    isRequired: true
  - name: activity
    description: The activity to create
    isRequired: true
  return:
    description: The created activity
- uid: microsoft_teams.api.clients.conversation.ConversationActivityClient.delete
  name: delete
  summary: Delete an activity from a conversation.
  signature: 'async delete(conversation_id: str, activity_id: str) -> None'
  parameters:
  - name: conversation_id
    description: The ID of the conversation
    isRequired: true
  - name: activity_id
    description: The ID of the activity to delete
    isRequired: true
- uid: microsoft_teams.api.clients.conversation.ConversationActivityClient.delete_targeted
  name: delete_targeted
  summary: 'Delete a targeted activity from a conversation.



### YamlMime:PythonClass
uid: microsoft_teams.api.BotTokenClient
name: BotTokenClient
fullName: microsoft_teams.api.BotTokenClient
module: microsoft_teams.api
summary: 'Client for managing bot tokens.


  Initialize the bot token client.'
constructor:
  syntax: 'BotTokenClient(options: Client | ClientOptions | None = None, api_client_settings:
    ApiClientSettings | None = None, cloud: CloudEnvironment | None = None)'
  parameters:
  - name: options
    description: Optional Client or ClientOptions instance.
    defaultValue: None
  - name: api_client_settings
    description: Optional API client settings.
    defaultValue: None
  - name: cloud
    description: Optional cloud environment for sovereign cloud support.
    defaultValue: None
methods:
- uid: microsoft_teams.api.BotTokenClient.get
  name: get
  summary: Get a bot token.
  signature: 'async get(credentials: ClientCredentials | TokenCredentials | ManagedIdentityCredentials
    | FederatedIdentityCredentials) -> GetBotTokenResponse'
  parameters:
  - name: credentials
    description: The credentials to use for authentication.
    isRequired: true
  return:
    description: The bot token response.
- uid: microsoft_teams.api.BotTokenClient.get_graph
  name: get_graph
  summary: Get a bot token for Microsoft Graph.
  signature: 'async get_graph(credentials: ClientCredentials | TokenCredentials |
    ManagedIdentityCredentials | FederatedIdentityCredentials) -> GetBotTokenResponse'
  parameters:
  - name: credentials
    description: The credentials to use for authentication.
    isRequired: true
  return:
    description: The bot token response.

uid: microsoft_teams.api.auth.CloudEnvironment
name: CloudEnvironment
fullName: microsoft_teams.api.auth.CloudEnvironment
module: microsoft_teams.api.auth
summary: 'Bundles all cloud-specific service endpoints for a given Azure environment.

  Use predefined instances (PUBLIC, US_GOV, US_GOV_DOD, CHINA)

  or construct a custom one via with_overrides().'
constructor:
  syntax: 'CloudEnvironment(login_endpoint: str, login_tenant: str, bot_scope: str,
    token_service_url: str, openid_metadata_url: str, token_issuer: str, graph_scope:
    str)'
  parameters:
  - name: login_endpoint
    isRequired: true
  - name: login_tenant
    isRequired: true
  - name: bot_scope
    isRequired: true
  - name: token_service_url
    isRequired: true
  - name: openid_metadata_url
    isRequired: true
  - name: token_issuer
    isRequired: true
  - name: graph_scope
    isRequired: true

methods:
- uid: microsoft_teams.api.activities.MessageActivityInput.add_ai_generated
  name: add_ai_generated
  summary: Add the 'Generated By AI' label.
  signature: add_ai_generated() -> Self
- uid: microsoft_teams.api.activities.MessageActivityInput.add_attachments
  name: add_attachments
  summary: Add attachments to the message.
  signature: 'add_attachments(*attachments: Attachment) -> Self'
  parameters:
  - name: '*attachments'
    description: Attachments to add
    isRequired: true
  return:
    description: Self for method chaining
- uid: microsoft_teams.api.activities.MessageActivityInput.add_card
  name: add_card
  summary: Add a card attachment to the message.
  signature: 'add_card(card: AdaptiveCard) -> Self'
  parameters:
  - name: card
    description: The card attachment to add
    isRequired: true
  - name: content
    description: The card content
    isRequired: true
  return:
    description: Self for method chaining
- uid: microsoft_teams.api.activities.MessageActivityInput.add_citation
  name: add_citation
  summary: Add citations.
  signature: 'add_citation(position: int, appearance: CitationAppearance) -> Self'
  parameters:
  - name: position
    isRequired: true
  - name: appearance
    isRequired: true
- uid: microsoft_teams.api.activities.MessageActivityInput.add_feedback
  name: add_feedback
  summary: Enable message feedback.
  signature: 'add_feedback(mode: Literal[''default'', ''custom''] = ''default'') ->
    Self'
  parameters:
  - name: mode
    description: '"default" shows Teams'' built-in thumbs up/down UI.

      "custom" triggers a message/fetchTask invoke so the bot

      can return its own task module dialog.'
    defaultValue: default
- uid: microsoft_teams.api.activities.MessageActivityInput.add_mention
  name: add_mention
  summary: Add a mention (@mention) to the message.
  signature: 'add_mention(account: Account, text: str | None = None, add_text: bool
    = True) -> Self'
  parameters:
  - name: account
    description: The account to mention
    isRequired: true
  - name: text
    description: Custom text for the mention (defaults to account.name)
    defaultValue: None
  - name: add_text
    description: Whether to append the mention text to the message
    defaultValue: 'True'
  return:
    description: Self for method chaining
- uid: microsoft_teams.api.activities.MessageActivityInput.add_quote
  name: add_quote
  summary: 'Add a quoted message reference and append a placeholder to text.

    Teams renders the quoted message as a preview bubble above the response text.

    If text is provided, it is appended to the quoted message placeholder.


    > [!WARNING]

    > Coming Soon

    >

    > This API is coming soon and may change in the future.

    >

    > Diagnostic: ExperimentalTeamsQuotedReplies

    >'
  signature: 'add_quote(message_id: str, text: str | None = None) -> Self'
  parameters:
  - name: message_id
    description: The ID of the message to quote
    isRequired: true
  - name: text
    description: Optional text, appended to the quoted message placeholder
    defaultValue: None
  return:
    description: Self for method chaining
- uid: microsoft_teams.api.activities.MessageActivityInput.add_stream_final
  name: add_stream_final
  summary: Add stream info, making this a final stream message.
  signature: add_stream_final() -> Self
  return:
    description: Self for method chaining
- uid: microsoft_teams.api.activities.MessageActivityInput.add_targeted_message_info
  name: add_targeted_message_info
  summary: 'Add a targetedMessageInfo entity for prompt preview.


    If an entity with type `"targetedMessageInfo"` already exists,

    it is not added again (one prompt preview per message).


    When adding the entity, any `quotedReply` entities and matching

    `<quoted messageId="..."/>` placeholder text are removed to avoid

    collision with prompt preview.'
  signature: 'add_targeted_message_info(message_id: str) -> Self'
  parameters:
  - name: message_id
    description: The message ID of the targeted message.
    isRequired: true
  return:
    description: Self for method chaining
- uid: microsoft_teams.api.activities.MessageActivityInput.add_text
  name: add_text
  summary: Append text to the message.
  signature: 'add_text(text: str) -> Self'
  parameters:
  - name: text
    description: Text to append
    isRequired: true
  return:
    description: Self for method chaining
- uid: microsoft_teams.api.activities.MessageActivityInput.get_account_mention
  name: get_account_mention
  summary: Get a mention entity by account ID.
  signature: 'get_account_mention(account_id: str) -> MentionEntity | None'
  parameters:
  - name: account_id
    description: The account ID to search for
    isRequired: true
  return:
    description: The mention entity if found, None otherwise
- uid: microsoft_teams.api.activities.MessageActivityInput.is_recipient_mentioned
  name: is_recipient_mentioned
  summary: Check if the recipient account is mentioned in the message.
  signature: is_recipient_mentioned() -> bool
  return:
    description: True if the recipient is mentioned
- uid: microsoft_teams.api.activities.MessageActivityInput.prepend_quote
  name: prepend_quote
  summary: 'Prepend a quotedReply entity and placeholder before existing text.

    Used by reply()/quote() for quote-above-response.


    > [!WARNING]

    > Coming Soon

    >

    > This API is coming soon and may change in the future.

    >

    > Diagnostic: ExperimentalTeamsQuotedReplies

    >'
  signature: 'prepend_quote(message_id: str) -> Self'
  parameters:
  - name: message_id
    description: The IC3 message ID of the message to quote
    isRequired: true
  return:
    description: Self for method chaining
- uid: microsoft_teams.api.activities.MessageActivityInput.with_attachment_layout
  name: with_attachment_layout
  summary: Set the layout hint for multiple attachments.
  signature: 'with_attachment_layout(attachment_layout: AttachmentLayout) -> Self'
  parameters:
  - name: attachment_layout
    description: Attachment layout (list, carousel)
    isRequired: true
  return:
    description: Self for method chaining
- uid: microsoft_teams.api.activities.MessageActivityInput.with_delivery_mode
  name: with_delivery_mode
  summary: Set the delivery mode for the activity.
  signature: 'with_delivery_mode(delivery_mode: Literal[''normal'', ''notification'',
    ''expectReplies'', ''ephemeral'']) -> Self'
  parameters:

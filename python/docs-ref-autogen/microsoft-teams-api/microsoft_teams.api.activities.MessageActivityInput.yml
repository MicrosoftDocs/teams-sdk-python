uid: microsoft_teams.api.activities.MessageActivityInput
name: MessageActivityInput
fullName: microsoft_teams.api.activities.MessageActivityInput
module: microsoft_teams.api.activities
summary: 'Input model for creating message activities with builder methods.


  Create a new model by parsing and validating input data from keyword arguments.


  Raises [*ValidationError*][pydantic_core.ValidationError] if the input data cannot
  be

  validated to form a valid model.


  *self* is explicitly positional-only to allow *self* as a field name.'
constructor:

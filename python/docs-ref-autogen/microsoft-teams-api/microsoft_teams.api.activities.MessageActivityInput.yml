    | None = None, locale: str | None = None, localTimestamp: datetime | None = None,
    channelId: Literal[''webchat'', ''msteams''] | str | None = None, from_: Account
    | None = None, conversation: ConversationAccount | None = None, replyToId: str
    | None = None, entities: List[ClientInfoEntity | MentionEntity | MessageEntity
    | AIMessageEntity | StreamInfoEntity | CitationEntity | SensitiveUsageEntity |
    ProductInfoEntity | QuotedReplyEntity | TargetedMessageInfoEntity | UnknownEntity]

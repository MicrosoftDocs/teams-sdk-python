    description: Delivery mode (normal, notification)
    isRequired: true
  return:
    description: Self for method chaining
- uid: microsoft_teams.api.activities.MessageActivityInput.with_recipient
  name: with_recipient
  summary: Set the recipient.
  signature: 'with_recipient(value: Account, is_targeted: bool | None = None) -> Self'
  parameters:
  - name: value
    description: The recipient account
    isRequired: true
  - name: is_targeted
    description: 'If True, marks this as a targeted message visible only to this

      recipient. If False, explicitly clears targeting. If None (the default),

      the existing is_targeted value is left unchanged.'
    defaultValue: None
  return:
    description: Self for method chaining
- uid: microsoft_teams.api.activities.MessageActivityInput.with_suggested_actions
  name: with_suggested_actions
  summary: Set the suggested actions for the activity.

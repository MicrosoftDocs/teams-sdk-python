- uid: microsoft_teams.api.ChatInfo.id
  name: id
  summary: '1 chat)

    or *19:<id>@thread.v2* (group chat).

    This is the unencrypted id, and it can differ from *conversation.id*.

    It is not sent for channels, where *channel_data.channel.id* plays this role.

    Use it as the conversation id to send a top-level message to the chat scope, or
    to reply in a reply chain.'
  signature: 'id: str | None'

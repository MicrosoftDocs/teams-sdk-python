functions:
- uid: microsoft_teams.api.card_attachment
  name: card_attachment
  summary: Create a card attachment of the specified type
  signature: 'card_attachment(attachment: AdaptiveCardAttachment | AnimationCardAttachment
    | AudioCardAttachment | HeroCardAttachment | OAuthCardAttachment | SigninCardAttachment
    | ThumbnailCardAttachment | VideoCardAttachment) -> Attachment'
  parameters:
  - name: type
    description: The type of card attachment to create
    isRequired: true
  - name: content
    description: The content for the card attachment (specific type based on card
      type)
    isRequired: true
  - name: attachment
    isRequired: true
  return:
    description: A card attachment of the specified type with the given content
- uid: microsoft_teams.api.config_from_cloud_name
  name: config_from_cloud_name
  summary: 'Resolve a cloud environment name (case-insensitive) to its corresponding
    instance.

    Valid names: "Public", "USGov", "USGovDoD", "China".'
  signature: 'config_from_cloud_name(name: str) -> CloudEnvironment'
  parameters:
  - name: name
    isRequired: true
- uid: microsoft_teams.api.is_invoke_response
  name: is_invoke_response
  summary: Type guard to check if a value is an InvokeResponse.
  signature: 'is_invoke_response(value: Any) -> bool'
  parameters:
  - name: value
    description: Value to compare
    isRequired: true
  return:
    description: True if value is type of InvokeResponse
- uid: microsoft_teams.api.merge_api_client_settings
  name: merge_api_client_settings
  summary: Merge API client settings with environment variables and defaults.
  signature: 'merge_api_client_settings(api_client_settings: ApiClientSettings | None
    = None, cloud: CloudEnvironment = CloudEnvironment(login_endpoint=''https://login.microsoftonline.com'',
    login_tenant=''botframework.com'', bot_scope=''https://api.botframework.com/.default'',
    token_service_url=''https://token.botframework.com'', openid_metadata_url=''https://login.botframework.com/v1/.well-known/openidconfiguration'',
    token_issuer=''https://api.botframework.com'', graph_scope=''https://graph.microsoft.com/.default''))
    -> ApiClientSettings'
  parameters:
  - name: api_client_settings
    description: Optional API client settings to merge.
    defaultValue: None
  - name: cloud
    description: Cloud environment for default oauth_url. Defaults to PUBLIC.
    defaultValue: CloudEnvironment(login_endpoint='https://login.microsoftonline.com',
      login_tenant='botframework.com', bot_scope='https://api.botframework.com/.default',
      token_service_url='https://token.botframework.com', openid_metadata_url='https://login.botframework.com/v1/.well-known/openidconfiguration',
      token_issuer='https://api.botframework.com', graph_scope='https://graph.microsoft.com/.default')
  return:
    description: Merged API client settings.
- uid: microsoft_teams.api.with_overrides
  name: with_overrides
  summary: 'Create a new CloudEnvironment by applying non-None overrides on top of
    a base.

    Returns the same instance if all overrides are None (no allocation).'
  signature: 'with_overrides(base: CloudEnvironment, **overrides: str | None) -> CloudEnvironment'
  parameters:
  - name: base
    isRequired: true

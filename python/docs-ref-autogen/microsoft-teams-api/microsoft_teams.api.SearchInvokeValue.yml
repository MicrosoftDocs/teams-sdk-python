uid: microsoft_teams.api.SearchInvokeValue
name: SearchInvokeValue
fullName: microsoft_teams.api.SearchInvokeValue
module: microsoft_teams.api
summary: 'Defines the structure that arrives in the Activity.Value for an Invoke activity
  with

  Name of ''application/search''. Sent by Adaptive Card dynamic typeahead ''Input.ChoiceSet''

  inputs (via ''choices.data'' / ''Data.Query'').


  Create a new model by parsing and validating input data from keyword arguments.


  Raises [*ValidationError*][pydantic_core.ValidationError] if the input data cannot
  be

  validated to form a valid model.


  *self* is explicitly positional-only to allow *self* as a field name.'
constructor:
  syntax: 'SearchInvokeValue(*, kind: Literal[''search'', ''searchAnswer'', ''typeahead'']
    | None = None, queryText: str, queryOptions: SearchInvokeOptions | None = None,
    context: Any | None = None, dataset: str | None = None, **extra_data: Any)'
  keywordOnlyParameters:
  - name: kind
    defaultValue: None
  - name: queryText
    isRequired: true
  - name: queryOptions
    defaultValue: None
  - name: context
    defaultValue: None
  - name: dataset
    defaultValue: None

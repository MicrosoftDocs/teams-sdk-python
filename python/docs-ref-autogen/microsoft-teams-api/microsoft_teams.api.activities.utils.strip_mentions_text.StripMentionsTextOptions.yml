### YamlMime:PythonClass
uid: microsoft_teams.api.activities.utils.strip_mentions_text.StripMentionsTextOptions
name: StripMentionsTextOptions
fullName: microsoft_teams.api.activities.utils.strip_mentions_text.StripMentionsTextOptions
module: microsoft_teams.api.activities.utils.strip_mentions_text
summary: Options for stripping mentions from text
constructor:
  syntax: 'StripMentionsTextOptions(account_id: str | None = None, tag_only: bool
    = False)'
  parameters:
  - name: account_id
    description: 'The account to remove mentions for.

      By default, all at-mentions listed in *entities* are removed.'
    defaultValue: None
  - name: tag_only
    description: "When *True*, the inner text of the tag will not be removed.\nEg.\
      \ input: Hello <at>my-bot</at>! How are you?\n\n   output: Hello my-bot! How\
      \ are you?"
    defaultValue: 'False'

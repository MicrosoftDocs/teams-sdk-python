uid: microsoft_teams.api.Step
name: Step
fullName: microsoft_teams.api.Step
module: microsoft_teams.api
summary: 'A versioned step describing work in a Plan.


  Keep the same `id` when updating a step and increment `version` for

  every change, including changes to its status, title, description, or sources.

  The application is responsible for incrementing the version.


  Create a new model by parsing and validating input data from keyword arguments.


  Raises [*ValidationError*][pydantic_core.ValidationError] if the input data cannot
  be

  validated to form a valid model.


  *self* is explicitly positional-only to allow *self* as a field name.'
constructor:
  syntax: 'Step(*, id: str, version: int, title: str, status: Literal[''active'',
    ''proposed'', ''completed'', ''blocked'', ''error''], description: str | None
    = None, sources: list[microsoft_teams.api.models.entity.plan_info_entity.StepSource]
    | None = None, **extra_data: Any)'
  keywordOnlyParameters:
  - name: id
    isRequired: true
  - name: version
    isRequired: true
  - name: title
    isRequired: true
  - name: status
    isRequired: true
  - name: description
    defaultValue: None
  - name: sources
    defaultValue: None

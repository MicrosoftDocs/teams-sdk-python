- uid: microsoft_teams.api.clients.UserTokenClient.sign_out
  name: sign_out
  summary: Sign out a user.
  signature: 'async sign_out(params: SignOutUserParams) -> None'
  parameters:
  - name: params
    description: Parameters for signing out the user.
    isRequired: true

- uid: microsoft_teams.api.activities.MessageReactionActivityInput.remove_reaction
  name: remove_reaction
  summary: 'Remove a message reaction and add it to the removed reactions list.


    This method will:

    1. Remove the reaction from reactions_added if it exists

    2. Add the reaction to reactions_removed'

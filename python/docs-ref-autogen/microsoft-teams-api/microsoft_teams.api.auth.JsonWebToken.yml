### YamlMime:PythonClass
uid: microsoft_teams.api.auth.JsonWebToken
name: JsonWebToken
fullName: microsoft_teams.api.auth.JsonWebToken
module: microsoft_teams.api.auth
summary: 'JSON Web Token implementation for Teams authentication.


  Initialize a typed accessor over an already-validated JWT payload.


  This constructor performs no signature verification, no issuer/audience

  checks, and no expiry enforcement. Constructing it from an untrusted

  token does NOT establish trust in the contained claims.


  Signature verification happens at the HTTP trust boundary via

  `TokenValidator.validate_token` (packages/apps/src/microsoft_teams/

  apps/auth/token_validator.py). Internal callers may also construct from

  tokens sourced from trusted identity infrastructure (MSAL, Bot Framework

  API responses).


  Callers must not construct this class from raw network input.'
constructor:
  syntax: 'JsonWebToken(value: str)'
  parameters:
  - name: value
    description: The JWT token string.
    isRequired: true
methods:
- uid: microsoft_teams.api.auth.JsonWebToken.is_expired
  name: is_expired
  summary: Check if the token is expired.
  signature: 'is_expired(buffer_ms: int = 300000) -> bool'
  parameters:
  - name: buffer_ms
    description: Buffer time in milliseconds (default 5 minutes).
    defaultValue: '300000'
  return:
    description: True if the token is expired, False otherwise.

### YamlMime:PythonClass
uid: microsoft_teams.api.ChannelData
name: ChannelData
fullName: microsoft_teams.api.ChannelData
module: microsoft_teams.api
summary: 'Channel data specific to messages received in Microsoft Teams


  Create a new model by parsing and validating input data from keyword arguments.


  Raises [*ValidationError*][pydantic_core.ValidationError] if the input data cannot
  be

  validated to form a valid model.


  *self* is explicitly positional-only to allow *self* as a field name.'
constructor:
  syntax: 'ChannelData(*, channel: ChannelInfo | None = None, app: AppInfo | None
    = None, chat: ChatInfo | None = None, replyChain: ReplyChainInfo | None = None,
    eventType: str | None = None, team: TeamInfo | None = None, notification: NotificationInfo
    | None = None, tenant: TenantInfo | None = None, meeting: MeetingInfo | None =
    None, settings: ChannelDataSettings | None = None, source: SourceInfo | None =
    None, feedbackLoopEnabled: bool | None = None, feedbackLoop: FeedbackLoop | None
    = None, streamId: str | None = None, streamType: Literal[''informative'', ''streaming'',
    ''final''] | str | None = None, streamSequence: int | None = None, **extra_data:
    Any)'
  keywordOnlyParameters:
  - name: channel
    defaultValue: None
  - name: app
    defaultValue: None
  - name: chat
    defaultValue: None
  - name: replyChain
    defaultValue: None
  - name: eventType
    defaultValue: None
  - name: team
    defaultValue: None
  - name: notification
    defaultValue: None
  - name: tenant
    defaultValue: None
  - name: meeting
    defaultValue: None
  - name: settings
    defaultValue: None
  - name: source
    defaultValue: None
  - name: feedbackLoopEnabled
    defaultValue: None
  - name: feedbackLoop
    defaultValue: None
  - name: streamId
    defaultValue: None
  - name: streamType
    defaultValue: None
  - name: streamSequence
    defaultValue: None
methods:
- uid: microsoft_teams.api.ChannelData.normalize_feedback
  name: normalize_feedback
  summary: 'Normalize the feedback loop configuration.

    This is necessary as the client only accepts either/or.'
  signature: normalize_feedback() -> Self
attributes:
- uid: microsoft_teams.api.ChannelData.app
  name: app
  summary: Information about the app that sent the message.
  signature: 'app: AppInfo | None'
- uid: microsoft_teams.api.ChannelData.channel
  name: channel
  summary: Information about the channel in which the message was sent.
  signature: 'channel: ChannelInfo | None'
- uid: microsoft_teams.api.ChannelData.chat
  name: chat
  summary: 'Information about the chat scope that contains the activity.


    Present for activities in a 1:1 chat, a group chat or a meeting chat.

    Not sent for channels, where *channel* is used.

    *chat.id* is the chat''s id without any reply chain (thread).

    Example: *19:<guid>_<guid>@unq.gbl.spaces* for a 1:1 chat, or *19:<id>@thread.v2*
    for a group chat.

    It can differ from *conversation.id*, which is opaque.

    Use it as the conversation id when sending a top-level message to the chat or
    replying in a reply chain.


    This API is in preview and may change in the future.

    Diagnostic: ExperimentalTeamsThreading'
  signature: 'chat: ChatInfo | None'
- uid: microsoft_teams.api.ChannelData.event_type
  name: event_type
  summary: Type of event.
  signature: 'event_type: str | None'
- uid: microsoft_teams.api.ChannelData.feedback_loop
  name: feedback_loop
  summary: 'Feedback loop configuration. Set type to ''custom'' to show a task module
    dialog.

    Set to ''default'' otherwise for standard feedback handling.'
  signature: 'feedback_loop: FeedbackLoop | None'
- uid: microsoft_teams.api.ChannelData.feedback_loop_enabled
  name: feedback_loop_enabled
  summary: 'Legacy feedback loop flag. Setting this to True is equivalent to feedback_loop=FeedbackLoop(type="default").

    Recommended to use feedback_loop directly. This field is normalized on model creation.'
  signature: 'feedback_loop_enabled: bool | None'
- uid: microsoft_teams.api.ChannelData.meeting
  name: meeting
  summary: Information about the tenant in which the message was sent.
  signature: 'meeting: MeetingInfo | None'
- uid: microsoft_teams.api.ChannelData.model_config
  name: model_config
  summary: Configuration for the model, should be a dictionary conforming to [*ConfigDict*][pydantic.config.ConfigDict].
  signature: 'model_config: ClassVar[ConfigDict] = {''alias_generator'': AliasGenerator(alias=None,
    validation_alias=<staticmethod(<function CustomBaseModel.validation_alias_generator>)>,
    serialization_alias=<staticmethod(<function CustomBaseModel.serialization_alias_generator>)>),
    ''arbitrary_types_allowed'': True, ''extra'': ''allow'', ''populate_by_name'':
    True, ''serialize_by_alias'': True, ''validate_by_alias'': True}'
- uid: microsoft_teams.api.ChannelData.notification
  name: notification
  summary: Notification settings for the message.
  signature: 'notification: NotificationInfo | None'
- uid: microsoft_teams.api.ChannelData.reply_chain
  name: reply_chain
  summary: 'The reply chain (thread) the activity belongs to, identified by its root
    message.


    *reply_chain.id* is the id of the message at the root of the chain, for example
    *1793384051102*.

    For a top-level message it equals the message''s own id. For a message in a thread
    it is the id of the thread''s root.

    The SDK uses it, with *chat.id* or *channel.id*, to place a response in the thread.


    This API is in preview and may change in the future.

    Diagnostic: ExperimentalTeamsThreading'
  signature: 'reply_chain: ReplyChainInfo | None'
- uid: microsoft_teams.api.ChannelData.settings
  name: settings
  summary: Information about the settings in which the message was sent.
  signature: 'settings: ChannelDataSettings | None'
- uid: microsoft_teams.api.ChannelData.source
  name: source
  summary: 'Where the activity was fired or invoked from.


    Observed on activities from a card button (*name* is *message*), from feedback
    on a message (*message*),

    and from a compose extension action, including a message action, and the dialogs
    it opens (*compose*).

    The SDK treats a message that carries a non-empty *source.name* as sent by a card
    button.


    This API is in preview and may change in the future.

    Diagnostic: ExperimentalTeamsThreading'
  signature: 'source: SourceInfo | None'
- uid: microsoft_teams.api.ChannelData.stream_id
  name: stream_id
  summary: ID of the stream. Assigned after the initial update is sent.
  signature: 'stream_id: str | None'
- uid: microsoft_teams.api.ChannelData.stream_sequence
  name: stream_sequence
  summary: 'Sequence number of the message in the stream. Starts at 1 for the first
    message and

    increments from there.'
  signature: 'stream_sequence: int | None'
- uid: microsoft_teams.api.ChannelData.stream_type
  name: stream_type
  summary: The type of message being sent.
  signature: 'stream_type: Literal[''informative'', ''streaming'', ''final''] | str
    | None'
- uid: microsoft_teams.api.ChannelData.team
  name: team
  summary: Information about the team in which the message was sent.
  signature: 'team: TeamInfo | None'
- uid: microsoft_teams.api.ChannelData.tenant
  name: tenant
  summary: Information about the tenant in which the message was sent.
  signature: 'tenant: TenantInfo | None'

### YamlMime:PythonClass
uid: microsoft_teams.api.ReactionClient
name: ReactionClient
fullName: microsoft_teams.api.ReactionClient
module: microsoft_teams.api
summary: 'Client for working with app message reactions for a given conversation/activity.


  Initialize the reaction client.'
constructor:
  syntax: 'ReactionClient(service_url: str, http_client: Client | None = None, api_client_settings:
    ApiClientSettings | None = None)'
  parameters:
  - name: service_url
    description: The base URL for the Teams service
    isRequired: true
  - name: http_client
    description: Optional HTTP client to use. If not provided, a new one will be created.
    defaultValue: None
  - name: api_client_settings
    description: Optional API client settings.
    defaultValue: None
methods:
- uid: microsoft_teams.api.ReactionClient.add
  name: add
  summary: Adds a reaction on an activity in a conversation.
  signature: 'async add(conversation_id: str, activity_id: str, reaction_type: Literal[''like'',
    ''heart'', ''1f440_eyes'', ''2705_whiteheavycheckmark'', ''launch'', ''1f4cc_pushpin'']
    | str) -> None'
  parameters:
  - name: conversation_id
    description: The conversation id.
    isRequired: true
  - name: activity_id
    description: The id of the activity to react to.
    isRequired: true
  - name: reaction_type
    description: 'The reaction type (for example: "like", "heart", "laugh", etc.).'
    isRequired: true
- uid: microsoft_teams.api.ReactionClient.delete
  name: delete
  summary: Removes a reaction from an activity in a conversation.
  signature: 'async delete(conversation_id: str, activity_id: str, reaction_type:
    Literal[''like'', ''heart'', ''1f440_eyes'', ''2705_whiteheavycheckmark'', ''launch'',
    ''1f4cc_pushpin''] | str) -> None'
  parameters:
  - name: conversation_id
    description: The conversation id.
    isRequired: true
  - name: activity_id
    description: The id of the activity the reaction is on.
    isRequired: true
  - name: reaction_type
    description: 'The reaction type to remove (for example: "like", "heart", "laugh",
      etc.).'
    isRequired: true

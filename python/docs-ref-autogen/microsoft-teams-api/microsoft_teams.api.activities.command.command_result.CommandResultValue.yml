summary: 'The value field of a CommandResultActivity contains metadata related to
  a command result.

  An optional extensible data payload may be included if defined by the command activity
  name.

  The presence of an error field indicates that the original command failed to complete.


  Create a new model by parsing and validating input data from keyword arguments.


  Raises [*ValidationError*][pydantic_core.ValidationError] if the input data cannot
  be

  validated to form a valid model.


  *self* is explicitly positional-only to allow *self* as a field name.'
